    function loadPlayerProfile() {
      const def = getDefaultProfile();
      try {
        const raw = localStorage.getItem(STORAGE_KEY) || localStorage.getItem('glitchpulse_profile_v2');
        if (!raw) return def;
        const parsed = JSON.parse(raw);
        const mergedLevels = { ...def.levels };
        if (parsed.levels) {
          for (const k of [1, 2, 3, 4, 5, 6, 7, 8, 9, 99]) {
            if (parsed.levels[k]) {
              mergedLevels[k] = { ...def.levels[k], ...parsed.levels[k] };
            }
          }
        }
        return {
          ...def,
          ...parsed,
          customization: { ...def.customization, ...(parsed.customization || {}) },
          levels: mergedLevels,
          achievements: { ...def.achievements, ...(parsed.achievements || {}) },
          customLevel: parsed.customLevel || def.customLevel,
        };
      } catch (e) {
        return def;
      }
    }

      if (!root) return;
      const el = document.createElement('div');
      el.className =

      el.innerHTML = `
        <div class="w-9 h-9 rounded-full bg-amber-500/20 border border-amber-400 flex items-center justify-center text-lg">${ach.icon}</div>
        <div>
          <span class="text-[10px] text-amber-400 font-bold uppercase tracking-widest block">ACHIEVEMENT UNLOCKED</span>
          <span class="font-bold text-white block">${ach.title}</span>
          <span class="text-[10px] text-zinc-400">${ach.desc}</span>
        </div>
      `;
      root.appendChild(el);
      setTimeout(() => {
        el.style.opacity = '0';
        el.style.transform = 'translateX(20px)';
        setTimeout(() => el.remove(), 350);
      }, 3600);
    }

      appState.profile.achievements[id] = true;

    function checkAABB(a, b) {
      return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
    }

    function checkSpikeCollision(playerBox, spike) {
      const inset = 5;
      const spikeBox = {
        x: spike.x + inset,
        y: spike.y + (spike.spikeDir === 'down' ? 0 : inset),
        w: spike.w - inset * 2,
        h: spike.h - inset,
      };
      return checkAABB(playerBox, spikeBox);
    }

    function checkBlockCollision(playerBox, block, gravityDir) {
      if (!checkAABB(playerBox, block)) return 'none';
      const feetY = gravityDir === 1 ? playerBox.y : playerBox.y + playerBox.h;
      const blockTopY = block.y + block.h;
      const blockBottomY = block.y;

      if (gravityDir === 1) {
        if (feetY >= blockTopY - 16) return 'top';
        if (playerBox.y + playerBox.h <= blockBottomY + 12) return 'head';
      } else {
        if (feetY <= blockBottomY + 16) return 'bottom';
        if (playerBox.y >= blockTopY - 12) return 'head';
      }
      return 'side';
    }

        if (obj.type === 'spike') {

            phaseJustPressed = true;
            aiStatus = 'PHASE SHIFT EVADE';
            aiTargetObj = obj;
            break;

          if (obj.h >= 100 && obj.phase === player.phase) {
            phaseJustPressed = true;
            aiStatus = 'PHASE BARRIER BYPASS';
            aiTargetObj = obj;
            break;

          if (obj.h < 100 && obj.phase !== player.phase) {
            phaseJustPressed = true;

        (level.id === 4 && px >= 5500 && px <= 6100) ||
        (level.id === 6 && px >= 8150 && px <= 8400)

        aiStatus = 'CHRONO DILATION 0.5X';

      for (const obj of objs) {

          if (obj.type === 'jump_ring' && !obj.activated) {

              obj.x + obj.w / 2 - (px + PLAYER_SIZE / 2),
              obj.y + obj.h / 2 - (py + PLAYER_SIZE / 2)
            );
            if (dist <= 48) {
              jumpJustPressed = true;
              jumpHeld = true;
              aiStatus = obj.ringType === 'dash' ? 'WARP RING BURST' : 'ORB RING TRIGGER';
              aiTargetObj = obj;
              return { jumpHeld, jumpJustPressed, phaseJustPressed, timeSlowHeld, aiStatus, aiTargetObj };

          }

            const isIntangible = obj.phase && obj.phase !== 'none' && obj.phase !== player.phase;

                  jumpJustPressed = true;
                  jumpHeld = true;
                  aiStatus = 'INVERTED VAULT';
                  aiTargetObj = obj;
                  break;
                }
              }
            } else if (obj.type === 'block') {
              if (player.gravityDir === 1) {
                const stepHeight = obj.y + obj.h - py;
                if (stepHeight > 5 && stepHeight <= 115 && distX <= 95) {
                  jumpJustPressed = true;
                  jumpHeld = true;
                  aiStatus = 'STEP ASCENSION';
                  aiTargetObj = obj;
                  break;

              } else {
                const stepDepth = py + PLAYER_SIZE - obj.y;
                if (stepDepth > 5 && stepDepth <= 115 && distX <= 95) {
                  jumpJustPressed = true;
                  jumpHeld = true;
                  aiStatus = 'INVERTED STEP';
                  aiTargetObj = obj;
                  break;
                }
              }
            } else if (obj.type === 'coin' && !obj.activated) {
              if (
                player.gravityDir === 1 &&

                distX <= 80 &&
                distX >= 5
              ) {
                jumpJustPressed = true;
                jumpHeld = true;
                aiStatus = 'DATA COIN INTERCEPT';
                aiTargetObj = obj;
                break;
              } else if (
                player.gravityDir === -1 &&
                py + PLAYER_SIZE - (obj.y + obj.h) > 25 &&

                distX <= 80 &&
                distX >= 5
              ) {

        let targetY = level.ceilingY / 2 - PLAYER_SIZE / 2;
        const lookWindow = 320;

        for (const obj of objs) {
          if (obj.x + obj.w < px || obj.x > px + lookWindow) continue;

          if (player.vehicleMode === 'glider') {
            jumpHeld = py + player.vy * 0.12 < targetY;

            jumpHeld = py < targetY - 6;

        } else {
          if (player.vehicleMode === 'glider') {
            jumpHeld = py + player.vy * 0.12 > targetY;
          } else {
            jumpHeld = py > targetY + 6;
          }
        }
      } else if (player.vehicleMode === 'ball') {
        // Geometry Dash Up-Roll Ball Mode AI: flip gravity when approaching spike on current surface
        if (player.isGrounded) {
          for (const obj of objs) {
            const distX = obj.x - pRight;

                jumpHeld = true;
                aiStatus = 'DOWN-ROLL GRAVITY FLIP ▼';
                aiTargetObj = obj;
                break;
              }
            }
          }
        }
      }

      return { jumpHeld, jumpJustPressed, phaseJustPressed, timeSlowHeld, aiStatus, aiTargetObj };
    }

        this.attempts = 1;
        this.coinsCollected = [false, false, false];
        this.score = 0;
        this.combo = 1;
        this.maxCombo = 1;
        this.elapsedTime = 0;
        this.startX = 150;
        this.bossHp = 100;
        this.bossLaserTimer = 0;
        this.bossAttackWave = 1;
        this.bossAttackType = 1;
        this.bossAttackLabel = '';
        this.bossDefeatTimer = 0;
        this.bossDefeatDuration = 3.5;
        this.bossDefeatCompleted = false;
        this.glitchIntensity = 0;
        this.aiStatus = 'STANDBY';
        this.aiTargetObj = null;

        this.checkpoints = [];
        this.particles = [];
        this.shockwaves = [];
        this.floatingTexts = [];
        this.trailNodes = [];
        this.currentRunGhost = [];
        this.bestGhostByLevel = {};
        this.cameraX = 0;
        this.screenShake = 0;
        this.bgTime = 0;

        this.stars = Array.from({ length: 75 }, (_, i) => ({
          x: (i * 173.7) % 1920,
          y: (i * 97.3) % 700,
          size: (i % 3) + 1,
          speed: 0.02 + (i % 4) * 0.015,
          twinklePhase: i * 0.8,
          char: String.fromCharCode(0x30a0 + (i % 64)),
        }));

        this.keyState = {
          jumpHeld: false,
          jumpJustPressed: false,
          waitForJumpRelease: false,
          phaseJustPressed: false,
          phaseKeyDown: false,
          timeSlowHeld: false,
          timeSlowToggled: false,
        };
        this.spawnGraceTimer = 0;

        this.frameCount = 0;
        this.fpsTimer = 0;
        this.currentFps = 60;

        this.canvas = document.createElement('canvas');
        this.ctx = this.canvas.getContext('2d', { alpha: false });
        this.container.appendChild(this.canvas);

        this.player = this.createDefaultPlayer();
        this.handleResize();
        this.bindEvents();

        this.tick = this.tick.bind(this);
        this.lastTime = performance.now();
        this.animId = requestAnimationFrame(this.tick);
      }

            computeAudioTimeForX(px) {
        if (!this.currentLevel.progressions) {
          const speed = this.currentLevel.baseSpeed || 420;
          return Math.max(0, (px - this.startX) / speed);
        }
        for (const p of this.currentLevel.progressions) {
          if (px >= p.startX && px <= p.endX) {
            const frac = (px - p.startX) / Math.max(1, p.endX - p.startX);
            return p.startT + frac * (p.endT - p.startT);
          }
        }
        if (px > 58551) return 125.0 + Math.min(9.8, (px - 58551) / 420);
        return 0;
      }

      getCurrentProgression() {
        if (!this.currentLevel.progressions) return null;
        const px = this.player.x;
        for (const p of this.currentLevel.progressions) {
          if (px >= p.startX && px <= p.endX) {
            return p;
          }
        }
        return this.currentLevel.progressions[this.currentLevel.progressions.length - 1];
      }

      createDefaultPlayer() {
        return {
          x: this.startX,
          y: 0,
          vy: 0,
          rotation: 0,
          isGrounded: true,
          gravityDir: 1,
          vehicleMode: 'cube',
          phase: 'cyan',
          isTimeDilated: false,
          speedMultiplier: 1.0,
          coyoteTimer: 0,
          jumpBufferTimer: 0,
          jumpKeyHeld: false,
          jumpJustPressed: false,
          phaseJustPressed: false,
        };
      }

      loadLevel(level) {
        this.currentLevel = level;
        this.checkpoints = [];
        this.coinsCollected = [false, false, false];
        this.attempts = 1;
        this.restartLevel();
      }

      setCustomization(custom) {
        this.customization = custom;
      }

      start() {
        rhythmAudio.ensureContext();
        this.restartLevel();
      }

      spawnFloatingText(x, y, text, color = '#00f0ff') {
        this.floatingTexts.push({
          x,
          y,
          text,
          color,
          life: 0.85,
          maxLife: 0.85,
        });
      }

      restartLevel() {
        rhythmAudio.stopMusic();

        this.keyState.jumpJustPressed = false;
        this.keyState.phaseJustPressed = false;
        if (this.keyState.jumpHeld) {
          this.keyState.waitForJumpRelease = true;
        }
        this.keyState.jumpHeld = false;
        this.spawnGraceTimer = 0.14;

        if (this.isPracticeMode && this.checkpoints.length > 0) {
          const cp = this.checkpoints[this.checkpoints.length - 1];
          this.player = {
            ...this.createDefaultPlayer(),
            x: cp.x,
            y: cp.y,
            vy: cp.vy,
            rotation: cp.rotation,
            gravityDir: cp.gravityDir,
            vehicleMode: cp.vehicleMode,
            phase: cp.phase,
            speedMultiplier: cp.speedMultiplier,
            isGrounded: cp.isGrounded,
          };
          this.coinsCollected = [...cp.coinsCollected];
          this.score = cp.score;
          this.combo = cp.combo;
          this.bossHp = cp.bossHp;
          this.currentLevel.objects.forEach((obj) => {
            obj.activated = cp.activatedIds.includes(obj.id);
            if (obj.baseX !== undefined) { obj.x = obj.baseX; obj.slowMoCleared = false; }
          });
        } else {
          this.player = this.createDefaultPlayer();
          this.coinsCollected = [false, false, false];
          this.score = 0;
          this.combo = 1;
          this.maxCombo = 1;
          this.elapsedTime = 0;
          this.bossHp = 100;
          this.bossDefeatTimer = 0;
          this.bossDefeatCompleted = false;
          this.currentRunGhost = [];
          this.currentLevel.objects.forEach((obj) => {
            obj.activated = false;
            if (obj.baseX !== undefined) { obj.x = obj.baseX; obj.slowMoCleared = false; }
          });
        }

        this.particles = [];
        this.shockwaves = [];
        this.floatingTexts = [];
        this.trailNodes = [];
        this.screenShake = 0;
        this.state = 'playing';

        rhythmAudio.startMusic(this.currentLevel, this.currentLevel.bpm, this.computeAudioTimeForX(this.player.x));
        if (this.onStateChange) this.onStateChange('playing');
      }

      setPracticeMode(enabled) {
        this.isPracticeMode = enabled;
        if (!enabled) {
          this.checkpoints = [];
        }
        this.emitTelemetry();
      }

      setAutoplayMode(enabled) {
        this.isAutoplayMode = enabled;
        this.keyState.jumpHeld = false;
        this.keyState.jumpJustPressed = false;
        this.keyState.phaseJustPressed = false;
        this.emitTelemetry();
      }

      toggleTimeSlow() {
        this.keyState.timeSlowToggled = !this.keyState.timeSlowToggled;
        this.emitTelemetry();
      }

      triggerManualPhaseShift() {
        if (this.state !== 'playing') return;
        this.keyState.phaseJustPressed = true;
      }

      triggerManualJumpDown() {
        if (this.state === 'crashed') {
          this.attempts++;
          this.restartLevel();
          return;
        }
        if (this.state !== 'playing') return;
        this.keyState.waitForJumpRelease = false;
        this.keyState.jumpJustPressed = true;
        this.keyState.jumpHeld = true;
      }

      triggerManualJumpUp() {
        this.keyState.jumpHeld = false;
        this.keyState.waitForJumpRelease = false;
      }

      addCheckpoint() {
        if (!this.isPracticeMode || this.state !== 'playing') return;
        const activatedIds = this.currentLevel.objects.filter((o) => o.activated).map((o) => o.id);
        this.checkpoints.push({
          x: this.player.x,
          y: this.player.y,
          vy: this.player.vy,
          rotation: this.player.rotation,
          gravityDir: this.player.gravityDir,
          vehicleMode: this.player.vehicleMode,
          phase: this.player.phase,
          speedMultiplier: this.player.speedMultiplier,
          isGrounded: this.player.isGrounded,
          coinsCollected: [...this.coinsCollected],
          score: this.score,
          combo: this.combo,
          bossHp: this.bossHp,
          activatedIds,
        });
        this.spawnFloatingText(this.player.x, this.player.y + 45, `CHECKPOINT #${this.checkpoints.length}`, '#10b981');
        rhythmAudio.playCheckpoint();
      }

      removeCheckpoint() {
        if (!this.isPracticeMode) return;
        if (this.checkpoints.length > 0) {
          this.checkpoints.pop();
          rhythmAudio.playCheckpoint();
        }
      }

      togglePause() {
        if (this.state === 'playing') {
          this.state = 'paused';
          rhythmAudio.stopMusic();
          if (this.onStateChange) this.onStateChange('paused');
        } else if (this.state === 'paused') {
          this.keyState.jumpHeld = false;
          this.keyState.jumpJustPressed = false;
          this.keyState.waitForJumpRelease = true;
          this.state = 'playing';
          rhythmAudio.startMusic(this.currentLevel.id, this.currentLevel.bpm);
          if (this.onStateChange) this.onStateChange('playing');
        }
      }

      bindEvents() {
        const onKeyDown = (e) => {
          const code = e.code.toLowerCase();
          if (this.state === 'idle' || this.state === 'victory') return;

          if (code === 'escape' || code === 'keyp') {
            e.preventDefault();
            this.togglePause();
            return;
          }

          if (code === 'keyr') {
            e.preventDefault();
            this.attempts++;
            this.restartLevel();
            return;
          }

          if (code === 'keya') {
            e.preventDefault();
            this.setAutoplayMode(!this.isAutoplayMode);
            return;
          }

          if (this.state === 'paused') {
            if (code === 'space') {
              e.preventDefault();
              this.togglePause();
            }
            return;
          }

          if (code === 'space' || code === 'arrowup' || code === 'keyw') {
            e.preventDefault();
            if (this.state === 'crashed') {
              this.keyState.waitForJumpRelease = true;
              this.keyState.jumpHeld = false;
              this.keyState.jumpJustPressed = false;
              this.attempts++;
              this.restartLevel();
              return;
            }
            if (this.keyState.waitForJumpRelease) return;
            if (!this.keyState.jumpHeld) {
              this.keyState.jumpJustPressed = true;
            }
            this.keyState.jumpHeld = true;
          }

          if (code === 'shiftleft' || code === 'shiftright' || code === 'keyf') {
            e.preventDefault();
            if (!this.keyState.phaseKeyDown) {
              this.keyState.phaseJustPressed = true;
              this.keyState.phaseKeyDown = true;
            }
          }

          if (code === 'keye' || code === 'keyc' || code === 'keys' || code === 'arrowdown') {
            e.preventDefault();
            this.keyState.timeSlowHeld = true;
          }

          if (code === 'keyz') {
            this.addCheckpoint();
          }
          if (code === 'keyx') {
            this.removeCheckpoint();
          }
        };

        const onKeyUp = (e) => {
          const code = e.code.toLowerCase();
          if (code === 'space' || code === 'arrowup' || code === 'keyw') {
            this.keyState.jumpHeld = false;
            this.keyState.waitForJumpRelease = false;
          }
          if (code === 'shiftleft' || code === 'shiftright' || code === 'keyf') {
            this.keyState.phaseKeyDown = false;
          }
          if (code === 'keye' || code === 'keyc' || code === 'keys' || code === 'arrowdown') {
            this.keyState.timeSlowHeld = false;
          }
        };

        const isUIElement = (target) => {
          return target && target.closest && target.closest('button, a, input, select, textarea, [data-ui-interactive="true"]');
        };

        const onMouseDown = (e) => {
          if (isUIElement(e.target)) return;
          if (this.state !== 'playing' && this.state !== 'crashed') return;

          if (e.button === 0) {
            if (this.state === 'crashed') {
              this.keyState.waitForJumpRelease = true;
              this.keyState.jumpHeld = false;
              this.keyState.jumpJustPressed = false;
              this.attempts++;
              this.restartLevel();
              return;
            }
            if (this.keyState.waitForJumpRelease) return;
            if (!this.keyState.jumpHeld) this.keyState.jumpJustPressed = true;
            this.keyState.jumpHeld = true;
          } else if (e.button === 2) {
            this.keyState.phaseJustPressed = true;
          }
        };

        const onMouseUp = (e) => {
          if (e.button === 0) {
            this.keyState.jumpHeld = false;
            this.keyState.waitForJumpRelease = false;
          }
        };

        const onContextMenu = (e) => e.preventDefault();

        const onTouchStart = (e) => {
          if (isUIElement(e.target)) return;
          if (this.state !== 'playing' && this.state !== 'crashed') return;

          if (this.state === 'crashed') {
            this.keyState.waitForJumpRelease = true;
            this.keyState.jumpHeld = false;
            this.keyState.jumpJustPressed = false;
            this.attempts++;
            this.restartLevel();
            return;
          }
          if (this.keyState.waitForJumpRelease) return;
          if (!this.keyState.jumpHeld) this.keyState.jumpJustPressed = true;
          this.keyState.jumpHeld = true;
        };

        const onTouchEnd = () => {
          this.keyState.jumpHeld = false;
          this.keyState.waitForJumpRelease = false;
        };

        const onBlur = () => {
          this.keyState.jumpHeld = false;
          this.keyState.jumpJustPressed = false;
          this.keyState.waitForJumpRelease = false;
          this.keyState.phaseJustPressed = false;
          this.keyState.phaseKeyDown = false;
          this.keyState.timeSlowHeld = false;
        };

        window.addEventListener('keydown', onKeyDown);
        window.addEventListener('keyup', onKeyUp);
        window.addEventListener('mousedown', onMouseDown);
        window.addEventListener('mouseup', onMouseUp);
        window.addEventListener('contextmenu', onContextMenu);
        window.addEventListener('touchstart', onTouchStart, { passive: true });
        window.addEventListener('touchend', onTouchEnd, { passive: true });
        window.addEventListener('blur', onBlur);
        window.addEventListener('resize', () => this.handleResize());
      }

      handleResize() {
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        const width = this.container.clientWidth || window.innerWidth;
        const height = this.container.clientHeight || window.innerHeight;
        this.canvas.width = width * dpr;
        this.canvas.height = height * dpr;
        this.canvas.style.width = width + 'px';
        this.canvas.style.height = height + 'px';
        this.ctx.setTransform(1, 0, 0, 1, 0, 0);
        this.ctx.scale(dpr, dpr);
      }

      emitTelemetry() {
        if (!this.onTelemetry) return;
        const progressPercent = Math.min(
          100,
          Math.max(0, Math.round((this.player.x / this.currentLevel.length) * 100))
        );
        this.onTelemetry({
          percent: progressPercent,
          attempts: this.attempts,
          coinsCollected: [...this.coinsCollected],
          isPractice: this.isPracticeMode,
          isAutoplay: this.isAutoplayMode,
          activePhase: this.player.phase,
          isTimeDilated: this.player.isTimeDilated,
          vehicleMode: this.player.vehicleMode,
          score: Math.floor(this.score),
          combo: this.combo,
          bossHp: Math.max(0, Math.round(this.bossHp)),
          bossAttackWave: this.bossAttackWave,
          bossAttackType: this.bossAttackType,
          bossAttackLabel: this.bossAttackLabel,
          isBossDefeatAnim: this.state === 'boss_defeat_anim',
          aiStatus: this.aiStatus,
          fps: this.currentFps,
        });
      }

      tick(now) {
        this.animId = requestAnimationFrame(this.tick);

        const rawDt = Math.min((now - this.lastTime) / 1000, 0.05);
        this.lastTime = now;
        this.bgTime += rawDt;

        this.frameCount++;
        this.fpsTimer += rawDt;
        if (this.fpsTimer >= 0.5) {
          this.currentFps = Math.round(this.frameCount / this.fpsTimer);
          this.frameCount = 0;
          this.fpsTimer = 0;
        }

        if (this.spawnGraceTimer > 0) {
          this.spawnGraceTimer = Math.max(0, this.spawnGraceTimer - rawDt);
        }

        let isDilated = this.keyState.timeSlowHeld || this.keyState.timeSlowToggled;
        if (this.isAutoplayMode && this.state === 'playing') {
          const aiPreview = computeAutoplayInputs(this.player, this.currentLevel);
          if (aiPreview.timeSlowHeld) isDilated = true;
          this.aiStatus = aiPreview.aiStatus || 'SYNCED';
          this.aiTargetObj = aiPreview.aiTargetObj || null;
        } else {
          this.aiStatus = 'MANUAL PILOT';
          this.aiTargetObj = null;
        }
        this.player.isTimeDilated = isDilated;
        rhythmAudio.setTimeDilation(isDilated);

        const effectiveDt = isDilated ? rawDt * 0.52 : rawDt;

        if (this.state === 'playing') {
          this.elapsedTime += rawDt;
          this.updatePhysics(effectiveDt);
        } else if (this.state === 'boss_defeat_anim') {
          this.bossDefeatTimer += rawDt;
          this.player.x += 120 * rawDt;
          this.screenShake = Math.max(4, Math.sin(this.bossDefeatTimer * 28) * 14);
          if (Math.random() < 0.55) {
            const width = this.container.clientWidth || window.innerWidth;
            const bx = this.cameraX + width * 0.72 + (Math.random() - 0.5) * 180;
            const by = 220 + (Math.random() - 0.5) * 140;
            const burstCols = ['#ff002b', '#00f0ff', '#ffaa00', '#ffffff', '#ff0077'];
            this.spawnSparks(bx, by, 14, burstCols[Math.floor(Math.random() * burstCols.length)]);
            if (Math.random() < 0.35) {
              this.shockwaves.push({
                x: bx,
                y: by,
                radius: 8,
                speed: 420,
                color: Math.random() > 0.5 ? '#00f0ff' : '#ff002b',
                alpha: 1.0,
                life: 0.5,
                maxLife: 0.5,
              });
            }
          }
          if (this.bossDefeatTimer >= this.bossDefeatDuration) {
            this.bossDefeatCompleted = true;
            this.FinalizeVictoryAfterAnim();
          }
        } else if (this.state === 'idle') {
          // Live Attract-Mode Background Scroll on Menu Screens
          this.cameraX += 140 * rawDt;
        }

        this.updateVFX(rawDt);
        this.render();

        this.keyState.jumpJustPressed = false;
        this.keyState.phaseJustPressed = false;

        this.emitTelemetry();
      }

      updatePhysics(dt) {
        const level = this.currentLevel;
        const objects = level.objects;
        const levelCeilingY = level.ceilingY;

        const subSteps = Math.max(1, Math.min(8, Math.ceil(dt / 0.006)));
        const subDt = dt / subSteps;

        if (!this.isAutoplayMode) {
          const allowJump = this.spawnGraceTimer <= 0 && !this.keyState.waitForJumpRelease;
          this.player.jumpKeyHeld = allowJump ? this.keyState.jumpHeld : false;
          this.player.jumpJustPressed = allowJump ? this.keyState.jumpJustPressed : false;
          this.player.phaseJustPressed = this.keyState.phaseJustPressed;
        }

        for (let step = 0; step < subSteps; step++) {
          const speed = level.baseSpeed * (this.player.speedMultiplier || 1);
          this.player.x += speed * subDt;
          this.score += speed * subDt * 0.25 * this.combo;

                    // Progression transition check for The Final Platform
          if (this.currentLevel.progressions) {
            const curP = this.getCurrentProgression();
            if (curP && this.lastProgressionId !== curP.id) {
              this.lastProgressionId = curP.id;
              this.screenShake = 10;
              this.spawnFloatingText(
                this.player.x + 80,
                this.player.y + 65,
                `${curP.name} [${curP.diff.toUpperCase()}]`,
                curP.id >= 5 ? '#ff0055' : '#00f0ff'
              );
            }
          }

          if (level.hasBoss) {
            this.bossHp = Math.max(2, 100 - (this.player.x / level.length) * 96);
          }
          if (level.isGlitchBoss && level.attackZones) {
            let foundZone = null;
            for (const z of level.attackZones) {
              if (this.player.x >= z.startX - 180 && this.player.x <= z.endX) {
                foundZone = z;
                break;
              }
            }
            if (foundZone) {
              if (this.bossAttackWave !== foundZone.wave) {
                this.bossAttackWave = foundZone.wave;
                this.bossAttackType = foundZone.attackType;
                this.bossAttackLabel = foundZone.label;
                this.screenShake = 9;
                this.spawnFloatingText(
                  this.player.x + 60,
                  this.player.y + 75,
                  `GLITCH BOSS WAVE ${foundZone.wave}/5 [ATTACK ${foundZone.attackType}]`,
                  '#ff002b'
                );
              }
            } else {
              this.bossAttackLabel = 'PATTERN [1-2-3-2-1] · SYSTEM CORRUPTION ACTIVE';
            }
          }

          if (this.isAutoplayMode) {
            const ai = computeAutoplayInputs(this.player, level);
            this.player.jumpKeyHeld = ai.jumpHeld;
            if (ai.jumpJustPressed) this.player.jumpJustPressed = true;
            if (ai.phaseJustPressed) this.player.phaseJustPressed = true;
            this.aiStatus = ai.aiStatus;
            this.aiTargetObj = ai.aiTargetObj;
          }

          // 1. Process Phase Shift
          if (this.player.phaseJustPressed) {
            this.player.phase = this.player.phase === 'cyan' ? 'magenta' : 'cyan';
            this.player.phaseJustPressed = false;
            rhythmAudio.playPhaseShift();
            this.screenShake = 5;
            this.score += 50;
            this.spawnPhaseShimmerParticles();
            this.spawnFloatingText(this.player.x, this.player.y + 42, `PHASE ${this.player.phase.toUpperCase()}`, this.player.phase === 'cyan' ? '#00f0ff' : '#ff0077');
            if (typeof appState !== 'undefined' && appState.profile) {
              appState.profile.phaseShiftsTotal = (appState.profile.phaseShiftsTotal || 0) + 1;
              if (appState.profile.phaseShiftsTotal >= 10) unlockAchievement('ach_phase_walker');
            }
          }

          // 2. Vehicle Kinematics
          if (this.player.vehicleMode === 'cube') {
            if (this.player.isGrounded) {
              this.player.coyoteTimer = 0.08;
            } else {
              this.player.coyoteTimer = Math.max(0, this.player.coyoteTimer - subDt);
            }

            if (this.player.jumpJustPressed) {
              this.player.jumpBufferTimer = 0.12;
              this.player.jumpJustPressed = false;
            } else {
              this.player.jumpBufferTimer = Math.max(0, this.player.jumpBufferTimer - subDt);
            }

            if (
              (this.player.jumpBufferTimer > 0 || this.player.jumpKeyHeld) &&
              (this.player.isGrounded || this.player.coyoteTimer > 0)
            ) {
              this.player.vy = CUBE_JUMP_IMPULSE * this.player.gravityDir;
              this.player.isGrounded = false;
              this.player.coyoteTimer = 0;
              this.player.jumpBufferTimer = 0;
              rhythmAudio.playJump();
              this.spawnSparks(this.player.x + PLAYER_SIZE / 2, this.player.y, 6, this.customization.primaryColor);
            }

            this.player.vy -= CUBE_GRAVITY * this.player.gravityDir * subDt;
            this.player.y += this.player.vy * subDt;

            if (!this.player.isGrounded) {
              const rotSpeed = 460 * this.player.gravityDir;
              this.player.rotation = (this.player.rotation + rotSpeed * subDt) % 360;
            } else {
              this.player.rotation = Math.round(this.player.rotation / 90) * 90;
            }
          } else if (this.player.vehicleMode === 'glider') {
            if (this.player.jumpKeyHeld) {
              this.player.vy += GLIDER_THRUST * this.player.gravityDir * subDt;
            } else {
              this.player.vy -= GLIDER_GRAVITY * this.player.gravityDir * subDt;
            }
            const maxVy = 420;
            this.player.vy = Math.max(-maxVy, Math.min(maxVy, this.player.vy));
            this.player.y += this.player.vy * subDt;

            const targetAngle = (this.player.vy / maxVy) * 35 * this.player.gravityDir;
            this.player.rotation += (targetAngle - this.player.rotation) * Math.min(1.0, 15 * subDt);
          } else if (this.player.vehicleMode === 'wave') {
            if (this.player.jumpKeyHeld) {
              this.player.vy = WAVE_SPEED_Y * this.player.gravityDir;
              this.player.rotation = -45 * this.player.gravityDir;
            } else {
              this.player.vy = -WAVE_SPEED_Y * this.player.gravityDir;
              this.player.rotation = 45 * this.player.gravityDir;
            }
            this.player.y += this.player.vy * subDt;
          } else if (this.player.vehicleMode === 'ufo') {
            if (this.player.jumpJustPressed) {
              this.player.vy = UFO_HOP_IMPULSE * this.player.gravityDir;
              this.player.jumpJustPressed = false;
              rhythmAudio.playJump();
              this.spawnSparks(this.player.x + PLAYER_SIZE / 2, this.player.y, 8, '#00ff66');
            }
            this.player.vy -= UFO_GRAVITY * this.player.gravityDir * subDt;
            this.player.vy = Math.max(-520, Math.min(520, this.player.vy));
            this.player.y += this.player.vy * subDt;
            this.player.rotation = (this.player.vy / 520) * 18 * this.player.gravityDir;
          } else if (this.player.vehicleMode === 'ball') {
            // Attack 3: Geometry Dash "Up-Roll" Ball Stage Mechanic
            if (this.player.isGrounded) {
              this.player.coyoteTimer = 0.09;
            } else {
              this.player.coyoteTimer = Math.max(0, this.player.coyoteTimer - subDt);
            }
            if (this.player.jumpJustPressed) {
              this.player.jumpBufferTimer = 0.14;
              this.player.jumpJustPressed = false;
            } else {
              this.player.jumpBufferTimer = Math.max(0, this.player.jumpBufferTimer - subDt);
            }
            if (
              this.player.jumpBufferTimer > 0 &&
              (this.player.isGrounded || this.player.coyoteTimer > 0)
            ) {
              this.player.gravityDir *= -1;
              this.player.vy = BALL_FLIP_IMPULSE * this.player.gravityDir;
              this.player.isGrounded = false;
              this.player.coyoteTimer = 0;
              this.player.jumpBufferTimer = 0;
              rhythmAudio.playGravityFlip();
              this.spawnSparks(
                this.player.x + PLAYER_SIZE / 2,
                this.player.y + PLAYER_SIZE / 2,
                10,
                '#ff0055'
              );
              this.spawnFloatingText(
                this.player.x,
                this.player.y + 34,
                this.player.gravityDir === -1 ? 'UP-ROLL ▲' : 'DOWN-ROLL ▼',
                '#ffaa00'
              );
            }
            this.player.vy -= BALL_GRAVITY * this.player.gravityDir * subDt;
            this.player.vy = Math.max(-680, Math.min(680, this.player.vy));
            this.player.y += this.player.vy * subDt;
            this.player.rotation = (this.player.rotation + 680 * this.player.gravityDir * subDt) % 360;
          }

          // 3. Floor & Ceiling Boundaries
          const minY = 0;
          const maxY = levelCeilingY - PLAYER_SIZE;
          let onBoundary = false;

          if (this.player.gravityDir === 1) {
            if (this.player.y <= minY) {
              this.player.y = minY;
              this.player.vy = 0;
              onBoundary = true;
            }
            if (this.player.y >= maxY) {
              this.player.y = maxY;
              this.player.vy = 0;
            }
          } else {
            if (this.player.y >= maxY) {
              this.player.y = maxY;
              this.player.vy = 0;
              onBoundary = true;
            }
            if (this.player.y <= minY) {
              this.player.y = minY;
              this.player.vy = 0;
            }
          }

          // 4. Object Collisions
          const pBox = { x: this.player.x, y: this.player.y, w: PLAYER_SIZE, h: PLAYER_SIZE };
          let touchingPlatform = false;

          for (const obj of objects) {
            if (Math.abs(obj.x - this.player.x) > 350) continue;

            const isPhaseIntangible = obj.phase && obj.phase !== 'none' && obj.phase !== this.player.phase;
            if (isPhaseIntangible) continue;

            if (obj.type === 'jump_ring' && !obj.activated) {
              const ringCenterX = obj.x + obj.w / 2;
              const ringCenterY = obj.y + obj.h / 2;
              const playerCenterX = this.player.x + pBox.w / 2;
              const playerCenterY = this.player.y + pBox.h / 2;
              const dist = Math.hypot(ringCenterX - playerCenterX, ringCenterY - playerCenterY);

              if (dist <= 52 && (this.player.jumpJustPressed || this.player.jumpBufferTimer > 0)) {
                obj.activated = true;
                if (obj.ringType === 'yellow' || obj.ringType === 'dash') {
                  this.player.vy = CUBE_JUMP_IMPULSE * this.player.gravityDir * 1.05;
                } else if (obj.ringType === 'purple') {
                  this.player.vy = CUBE_JUMP_IMPULSE * this.player.gravityDir * 0.85;
                } else if (obj.ringType === 'blue') {
                  this.player.gravityDir = this.player.gravityDir * -1;
                  this.player.vy = CUBE_JUMP_IMPULSE * this.player.gravityDir * 0.85;
                }
                this.player.isGrounded = false;
                this.player.jumpBufferTimer = 0;
                this.score += obj.empBlast ? 500 : 150;
                this.combo = Math.min(16, this.combo + 1);
                this.maxCombo = Math.max(this.maxCombo, this.combo);
                if (this.combo >= 10) unlockAchievement('ach_overdrive');
                rhythmAudio.playRingHit();
                this.screenShake = obj.empBlast ? 12 : 7;
                this.spawnSparks(ringCenterX, ringCenterY, 18, obj.ringType === 'dash' ? '#00ff66' : '#ffaa00');
                this.spawnFloatingText(
                  ringCenterX,
                  ringCenterY + 28,
                  obj.empBlast ? 'EMP BOSS BLAST +500' : obj.ringType === 'dash' ? 'WARP BOOST +250' : 'PERFECT SYNC +150',
                  obj.ringType === 'dash' ? '#00ff66' : '#ffaa00'
                );
              }
            } else if (obj.type === 'jump_pad' && !obj.activated) {
              if (checkAABB(pBox, obj)) {
                obj.activated = true;
                if (obj.padType === 'yellow') {
                  this.player.vy = CUBE_JUMP_IMPULSE * 1.35 * this.player.gravityDir;
                } else if (obj.padType === 'pink') {
                  this.player.vy = CUBE_JUMP_IMPULSE * 0.95 * this.player.gravityDir;
                }
                this.player.isGrounded = false;
                this.score += 100;
                this.combo = Math.min(16, this.combo + 1);
                rhythmAudio.playJump();
                this.screenShake = 5;
                this.spawnSparks(obj.x + obj.w / 2, obj.y + obj.h / 2, 14, '#00f0ff');
                this.spawnFloatingText(obj.x, obj.y + 32, 'PAD LAUNCH +100', '#00f0ff');
              }
            } else if (
              (obj.type === 'portal_gravity' ||
                obj.type === 'portal_vehicle' ||
                obj.type === 'portal_phase' ||
                obj.type === 'speed_gate') &&
              !obj.activated
            ) {
              if (checkAABB(pBox, obj)) {
                obj.activated = true;
                if (obj.type === 'portal_gravity' && obj.portalGravity) {
                  this.player.gravityDir = obj.portalGravity;
                  rhythmAudio.playGravityFlip();
                  this.spawnFloatingText(obj.x, this.player.y + 40, obj.portalGravity === -1 ? 'GRAVITY INVERT ▲' : 'GRAVITY NORMAL ▼', '#38bdf8');
                } else if (obj.type === 'portal_vehicle' && obj.portalVehicle) {
                  this.player.vehicleMode = obj.portalVehicle;
                  this.player.rotation = 0;
                  rhythmAudio.playJump();
                  this.spawnFloatingText(obj.x, this.player.y + 40, `${obj.portalVehicle.toUpperCase()} MODE`, '#ffaa00');
                } else if (obj.type === 'portal_phase' && obj.phase) {
                  this.player.phase = obj.phase;
                  rhythmAudio.playPhaseShift();
                  this.spawnFloatingText(obj.x, this.player.y + 40, `SPECTRUM: ${obj.phase.toUpperCase()}`, obj.phase === 'cyan' ? '#00f0ff' : '#ff0077');
                } else if (obj.type === 'speed_gate' && obj.speedMultiplier) {
                  this.player.speedMultiplier = obj.speedMultiplier;
                  rhythmAudio.playRingHit();
                  this.spawnFloatingText(obj.x, this.player.y + 40, `SPEED ${obj.speedMultiplier}X`, '#10b981');
                }
                this.score += 200;
                this.combo = Math.min(16, this.combo + 1);
                if (this.combo >= 10) unlockAchievement('ach_overdrive');
                this.screenShake = 8;
                this.spawnSparks(obj.x + obj.w / 2, this.player.y + PLAYER_SIZE / 2, 20, '#00f0ff');
              }
            } else if (obj.type === 'coin' && !obj.activated) {
              if (checkAABB(pBox, obj)) {
                obj.activated = true;
                rhythmAudio.playCoin();
                if (obj.coinIndex !== undefined) {
                  this.coinsCollected[obj.coinIndex] = true;
                }
                this.score += 1000;
                this.combo = Math.min(16, this.combo + 2);
                if (this.combo >= 10) unlockAchievement('ach_overdrive');
                this.spawnSparks(obj.x + obj.w / 2, obj.y + obj.h / 2, 28, '#ffd700');
                this.spawnFloatingText(obj.x, obj.y + 36, 'DATA COIN ★ +1000', '#ffd700');
              }
            } else if (obj.type === 'bollard') {
              // Boss Attack 1: Hyper-velocity low bollard moving toward the player!
              // Moves fast enough that Time Slow (0.5x) is necessary to jump over it cleanly.
              const distToPlayer = obj.x - this.player.x;
              if (distToPlayer < 480 && distToPlayer > -120) {
                const bollardVel = this.player.isTimeDilated ? 120 : 640;
                obj.x -= bollardVel * subDt;
              }
              // Without Time Slow active, the Glitch Boss projects an overcharged vertical lock-field
              // above the fast bollard so you MUST engage Time Slow [E / S] to jump over it in slow-mo!
              if (this.player.isTimeDilated && this.player.y >= obj.h - 4) obj.slowMoCleared = true;
              const effectiveH = (this.player.isTimeDilated || obj.slowMoCleared) ? obj.h : 175;
              const bollardBox = {
                x: obj.x + 4,
                y: obj.y,
                w: obj.w - 8,
                h: effectiveH - 4,
              };
              if (checkAABB(pBox, bollardBox)) {
                if (!this.player.isTimeDilated) {
                  this.spawnFloatingText(
                    this.player.x,
                    this.player.y + 60,
                    'TOO FAST! HOLD [E / S] TIME SLOW!',
                    '#ff002b'
                  );
                }
                this.handleCrash();
                return;
              }
            } else if (obj.type === 'spike') {
              if (checkSpikeCollision(pBox, obj)) {
                this.handleCrash();
                return;
              }
            } else if (obj.type === 'block') {
              const col = checkBlockCollision(pBox, obj, this.player.gravityDir);
              if (col === 'side') {
                this.handleCrash();
                return;
              } else if (col === 'top' && this.player.gravityDir === 1) {
                this.player.y = obj.y + obj.h;
                this.player.vy = 0;
                touchingPlatform = true;
              } else if (col === 'bottom' && this.player.gravityDir === -1) {
                this.player.y = obj.y - pBox.h;
                this.player.vy = 0;
                touchingPlatform = true;
              } else if (col === 'head') {
                if (this.player.gravityDir === 1) {
                  this.player.y = obj.y - pBox.h;
                  this.player.vy = 0;
                } else {
                  this.player.y = obj.y + obj.h;
                  this.player.vy = 0;
                }
              }
            }
          }

          this.player.isGrounded = onBoundary || touchingPlatform;

          if (this.player.x >= level.length) {
            this.handleVictory();
            return;
          }
        }

        // Record ghost frame every ~25px
        if (
          this.currentRunGhost.length === 0 ||
          this.player.x - this.currentRunGhost[this.currentRunGhost.length - 1].x >= 24
        ) {
          this.currentRunGhost.push({
            x: this.player.x,
            y: this.player.y,
            rotation: this.player.rotation,
          });
        }
      }

      handleCrash() {
        this.state = 'crashed';
        this.combo = 1;
        rhythmAudio.stopMusic();
        rhythmAudio.playCrash();
        this.screenShake = 18;
        this.spawnDeathBurst(
          this.player.x + PLAYER_SIZE / 2,
          this.player.y + PLAYER_SIZE / 2,
          this.customization.deathVfx
        );
        if (this.onStateChange) this.onStateChange('crashed');
      }

      handleVictory() {
        this.bossHp = 0;
        rhythmAudio.stopMusic();
        if (this.currentLevel.isGlitchBoss && !this.bossDefeatCompleted) {
          // Trigger dramatic on-canvas Glitch Boss Defeat Animation first!
          this.state = 'boss_defeat_anim';
          this.bossDefeatTimer = 0;
          this.screenShake = 22;
          rhythmAudio.playBossDefeat();
          this.spawnFloatingText(
            this.player.x + 80,
            this.player.y + 90,
            'KERNEL PURGED · DEFEATING GLITCH SYSTEM BOSS!',
            '#00f0ff'
          );
          if (this.onStateChange) this.onStateChange('boss_defeat_anim');
          return;
        }
        this.FinalizeVictoryAfterAnim();
      }

      FinalizeVictoryAfterAnim() {
        this.state = 'victory';
        this.bossHp = 0;
        rhythmAudio.playVictory();
        this.screenShake = 12;
        if (this.currentRunGhost.length > 5) {
          this.bestGhostByLevel[this.currentLevel.id] = [...this.currentRunGhost];
        }
        if (this.onVictory) {
          this.onVictory({
            level: this.currentLevel,
            attempts: this.attempts,
            coins: [...this.coinsCollected],
            time: Math.max(1, this.elapsedTime),
            score: Math.floor(this.score),
            maxCombo: this.maxCombo,
            wasAutoplay: this.isAutoplayMode,
          });
        }
        if (this.onStateChange) this.onStateChange('victory');
      }

      updateVFX(dt) {
        if (this.state === 'playing' || this.state === 'boss_defeat_anim' || this.state === 'crashed' || this.state === 'paused' || this.state === 'victory') {
          const targetCamX = this.player.x - 240;
          this.cameraX += (targetCamX - this.cameraX) * Math.min(1.0, 16 * dt);
        }

        if (this.screenShake > 0) {
          this.screenShake = Math.max(0, this.screenShake - 28 * dt);
        }

        if (this.state === 'playing') {
          this.trailNodes.unshift({
            x: this.player.x,
            y: this.player.y,
            rotation: this.player.rotation,
            alpha: 0.9,
          });
          if (this.trailNodes.length > 24) this.trailNodes.pop();

          const trailType = this.customization.trail;
          if (trailType === 'sparkle' && Math.random() < 0.65) {
            this.particles.push({
              x: this.player.x,
              y: this.player.y + PLAYER_SIZE / 2 + (Math.random() - 0.5) * 16,
              vx: -180 - Math.random() * 90,
              vy: (Math.random() - 0.5) * 70,
              size: 3 + Math.random() * 4,
              color: this.customization.primaryColor,
              alpha: 1.0,
              life: 0.35,
              maxLife: 0.35,
            });
          } else if (trailType === 'glitch' && Math.random() < 0.75) {
            this.particles.push({
              x: this.player.x - Math.random() * 10,
              y: this.player.y + Math.random() * PLAYER_SIZE,
              vx: -240,
              vy: 0,
              size: 5 + Math.random() * 6,
              color: Math.random() > 0.5 ? this.customization.primaryColor : '#ff0077',
              alpha: 0.9,
              life: 0.25,
              maxLife: 0.25,
            });
          } else if (trailType === 'rainbow' && Math.random() < 0.85) {
            const hues = ['#00f0ff', '#ff0077', '#ffaa00', '#00ff66', '#a855f7'];
            this.particles.push({
              x: this.player.x,
              y: this.player.y + PLAYER_SIZE / 2 + Math.sin(this.bgTime * 18) * 12,
              vx: -200,
              vy: (Math.random() - 0.5) * 40,
              size: 5,
              color: hues[Math.floor(this.bgTime * 15) % hues.length],
              alpha: 0.95,
              life: 0.32,
              maxLife: 0.32,
            });
          }
        }

        for (let i = this.particles.length - 1; i >= 0; i--) {
          const p = this.particles[i];
          p.life -= dt;
          if (p.life <= 0) {
            this.particles.splice(i, 1);
            continue;
          }
          p.x += p.vx * dt;
          p.y += p.vy * dt;
          p.alpha = p.life / p.maxLife;
        }

        for (let i = this.shockwaves.length - 1; i >= 0; i--) {
          const sw = this.shockwaves[i];
          sw.life -= dt;
          if (sw.life <= 0) {
            this.shockwaves.splice(i, 1);
            continue;
          }
          sw.radius += sw.speed * dt;
          sw.alpha = sw.life / sw.maxLife;
        }

        for (let i = this.floatingTexts.length - 1; i >= 0; i--) {
          const ft = this.floatingTexts[i];
          ft.life -= dt;
          if (ft.life <= 0) {
            this.floatingTexts.splice(i, 1);
            continue;
          }
          ft.y += 42 * dt;
        }

        for (const node of this.trailNodes) {
          node.alpha -= dt * 3.2;
        }
      }

      spawnSparks(x, y, count, color) {
        for (let i = 0; i < count; i++) {
          const angle = Math.random() * Math.PI * 2;
          const speed = 110 + Math.random() * 240;
          this.particles.push({
            x,
            y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            size: 3 + Math.random() * 4,
            color,
            alpha: 1.0,
            life: 0.4 + Math.random() * 0.25,
            maxLife: 0.55,
          });
        }
      }

      spawnPhaseShimmerParticles() {
        const col = this.player.phase === 'cyan' ? '#00f0ff' : '#ff0077';
        for (let i = 0; i < 22; i++) {
          this.particles.push({
            x: this.player.x + (Math.random() - 0.5) * 44,
            y: this.player.y + (Math.random() - 0.5) * 44,
            vx: (Math.random() - 0.5) * 220,
            vy: (Math.random() - 0.5) * 220,
            size: 3 + Math.random() * 4,
            color: col,
            alpha: 1.0,
            life: 0.32,
            maxLife: 0.32,
          });
        }
      }

      spawnDeathBurst(x, y, vfxType) {
        const col = this.customization.primaryColor;
        const count = vfxType === 'nova' || vfxType === 'vortex' ? 65 : 42;
        for (let i = 0; i < count; i++) {
          const angle = Math.random() * Math.PI * 2;
          const speed = 150 + Math.random() * 390;
          this.particles.push({
            x,
            y,
            vx: Math.cos(angle) * speed,
            vy: Math.sin(angle) * speed,
            size: vfxType === 'fracture' ? 6 + Math.random() * 6 : 4 + Math.random() * 4,
            color: Math.random() > 0.35 ? col : '#ffffff',
            alpha: 1.0,
            life: 0.6 + Math.random() * 0.3,
            maxLife: 0.75,
          });
        }
        if (vfxType === 'shockwave' || vfxType === 'nova' || vfxType === 'vortex') {
          this.shockwaves.push({ x, y, radius: 10, speed: 460, color: col, alpha: 1.0, life: 0.55, maxLife: 0.55 });
          this.shockwaves.push({ x, y, radius: 4, speed: 290, color: '#ffffff', alpha: 0.9, life: 0.45, maxLife: 0.45 });
        }
      }

      // --- Master Render Pipeline with Responsive Corridor Scaling ---
      render() {
        const width = this.container.clientWidth || window.innerWidth;
        const height = this.container.clientHeight || window.innerHeight;

        let shakeX = 0;
        let shakeY = 0;
        if (this.screenShake > 0) {
          shakeX = (Math.random() - 0.5) * this.screenShake;
          shakeY = (Math.random() - 0.5) * this.screenShake;
        }

        // Responsive vertical corridor fit so the 420px arena never clips on short viewports
        const ceilH = this.currentLevel.ceilingY || 420;
        const availH = Math.max(220, height - 180);
        const playScale = Math.min(1.0, Math.max(0.5, availH / ceilH));
        const scaledCorridorH = ceilH * playScale;
        const floorScreenY = Math.min(
          height - this.currentLevel.floorY,
          Math.round((height + scaledCorridorH) / 2 + 12)
        );

        this.ctx.save();
        this.ctx.translate(shakeX, shakeY);

        // 1. Upgraded 6-Biome Dynamic Cyberpunk Background
        this.renderBackground(width, height, floorScreenY, scaledCorridorH);

        this.ctx.save();
        this.ctx.translate(0, floorScreenY);
        this.ctx.scale(playScale, -playScale);
        this.ctx.translate(-this.cameraX, 0);

        // 2. Render 3D-Style Floor & Ceiling Channels + Runway Markers
        this.renderFloorsAndCeilings(width / playScale);

        // 3. Render Personal Best Ghost Replay
        if (this.showGhost && this.state === 'playing') {
          this.renderGhostReplay();
        }

        // 4. Render Level Obstacles, Sawblades & Portals
        this.renderLevelObjects(width / playScale);

        // 5. Render Practice Checkpoints
        if (this.isPracticeMode) {
          this.renderCheckpoints();
        }

        // 6. Render Trails, Shockwaves & Particles
        this.renderParticles();

        // 7. Render Custom Player Vehicle + AI Pilot Target Vector
        if (this.state !== 'crashed') {
          this.renderPlayer();
          if (this.isAutoplayMode && this.state === 'playing') {
            this.renderAutoplayVectorOverlay();
          }
        }

        // 8. Render Floating Rhythm Judgement Popups
        this.renderFloatingTexts();

        this.ctx.restore();

        // 9. Render Screen Vignette, Boss Sentinel & Crash Prompt
        this.renderScreenVignette(width, height);

        this.ctx.restore();
      }

      // --- 6-BIOME PROCEDURAL CYBERPUNK BACKGROUND SHADER ---
      renderBackground(width, height, floorScreenY, scaledCorridorH) {
        const ctx = this.ctx;
        const theme = this.currentLevel.theme;
        const biome = theme.biome || 'neon_city';
        const ceilScreenY = floorScreenY - scaledCorridorH;

        const bps = this.currentLevel.bpm / 60;
        const beatPhase = (this.bgTime * bps) % 1;
        const beatPulse = Math.pow(1 - beatPhase, 3);

        // LAYER 1: Deep Space Nebula Sky Gradient
        const skyGrad = ctx.createLinearGradient(0, 0, 0, height);
        skyGrad.addColorStop(0, theme.bgGradient[0]);
        skyGrad.addColorStop(0.55, theme.bgGradient[1]);
        skyGrad.addColorStop(1, '#04060b');
        ctx.fillStyle = skyGrad;
        ctx.fillRect(0, 0, width, height);

        // Ambient Phase Nebula Glow
        const phaseCol = this.player.phase === 'cyan' ? 'rgba(0, 240, 255, 0.10)' : 'rgba(255, 0, 119, 0.10)';
        const nebulaGrad = ctx.createRadialGradient(
          width * 0.68,
          height * 0.35,
          20,
          width * 0.68,
          height * 0.35,
          width * 0.55
        );
        nebulaGrad.addColorStop(0, phaseCol);
        nebulaGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
        ctx.fillStyle = nebulaGrad;
        ctx.fillRect(0, 0, width, height);

        // LAYER 2: Biome-Specific Celestial & Atmospheric Phenomena
        if (biome === 'quantum_nexus') {
          // Cyber Aurora Borealis Ribbons + Falling Matrix Hex Rain
          ctx.save();
          for (let a = 0; a < 3; a++) {
            ctx.beginPath();
            ctx.moveTo(0, ceilScreenY + 60 + a * 35);
            for (let x = 0; x <= width; x += 60) {
              const waveY =
                ceilScreenY +
                60 +
                a * 35 +
                Math.sin(x * 0.006 + this.bgTime * 1.4 + a) * 28 +
                Math.cos(x * 0.012 - this.bgTime) * 14;
              ctx.lineTo(x, waveY);
            }
            ctx.strokeStyle = a % 2 === 0 ? 'rgba(0, 255, 102, 0.22)' : 'rgba(0, 240, 255, 0.22)';
            ctx.lineWidth = 16;
            ctx.stroke();
          }
          ctx.font = '10px "JetBrains Mono", monospace';
          ctx.fillStyle = 'rgba(0, 255, 102, 0.26)';
          for (const st of this.stars) {
            const sx = ((st.x - this.cameraX * st.speed) % width + width) % width;
            const sy = ((st.y + this.bgTime * (90 + st.size * 35)) % Math.max(200, floorScreenY - 20));
            ctx.fillText(st.char, sx, sy);
          }
          ctx.restore();
        } else {
          // Twinkling Starfield
          for (const st of this.stars) {
            const sx = ((st.x - this.cameraX * st.speed) % width + width) % width;
            const sy = st.y % Math.max(200, floorScreenY - 40);
            const twinkle = 0.35 + 0.65 * Math.abs(Math.sin(this.bgTime * 2.2 + st.twinklePhase));
            ctx.fillStyle = `rgba(255, 255, 255, ${twinkle * 0.75})`;
            ctx.fillRect(sx, sy, st.size, st.size);
          }
        }

        // LAYER 3: Biome Centerpiece (Synthwave Sun / Chrono Astrolabe / Black Hole / Omega Sentinel Boss)
        const sunX = width * 0.72;
        const sunY = Math.max(ceilScreenY + 115, height * 0.34);
        const sunRadius = 68 + beatPulse * 8;

        ctx.save();
        if (biome === 'temporal_fracture') {
          // Rotating Clockwork Astrolabe Rings
          ctx.strokeStyle = 'rgba(56, 189, 248, 0.38)';
          ctx.lineWidth = 2;
          for (let r = 1; r <= 3; r++) {
            ctx.save();
            ctx.translate(sunX, sunY);
            ctx.rotate(this.bgTime * (r % 2 === 0 ? 0.45 : -0.6) * r);
            ctx.setLineDash([18, 10]);
            ctx.beginPath();
            ctx.arc(0, 0, sunRadius + r * 20, 0, Math.PI * 2);
            ctx.stroke();
            ctx.restore();
          }
        } else if (biome === 'solar_reactor') {
          // Relativistic Accretion Disk Halo
          ctx.strokeStyle = 'rgba(255, 170, 0, 0.45)';
          ctx.lineWidth = 5;
          ctx.beginPath();
          ctx.ellipse(sunX, sunY, sunRadius * 1.85, sunRadius * 0.42, -0.22, 0, Math.PI * 2);
          ctx.stroke();
        } else {
          ctx.strokeStyle = this.player.phase === 'cyan' ? 'rgba(0, 240, 255, 0.22)' : 'rgba(255, 0, 119, 0.22)';
          ctx.lineWidth = 1.5;
          for (let r = 1; r <= 3; r++) {
            ctx.beginPath();
            ctx.arc(sunX, sunY, sunRadius + r * 22 + beatPulse * 10, 0, Math.PI * 2);
            ctx.stroke();
          }
        }

        const sunGrad = ctx.createLinearGradient(sunX, sunY - sunRadius, sunX, sunY + sunRadius);
        sunGrad.addColorStop(0, theme.sunColors[0]);
        sunGrad.addColorStop(1, theme.sunColors[1]);
        ctx.fillStyle = sunGrad;
        ctx.beginPath();
        ctx.arc(sunX, sunY, sunRadius, 0, Math.PI * 2);
        ctx.fill();

        if (biome === 'solar_reactor' || biome === 'omega_core') {
          // Black Hole Eclipse Void Core
          ctx.fillStyle = '#050208';
          ctx.beginPath();
          ctx.arc(sunX, sunY, sunRadius * 0.68, 0, Math.PI * 2);
          ctx.fill();
        } else {
          ctx.fillStyle = theme.bgGradient[1];
          for (let sliceY = sunY + 8; sliceY < sunY + sunRadius; sliceY += 11) {
            const sliceH = 2 + ((sliceY - sunY) / sunRadius) * 4.5;
            ctx.fillRect(sunX - sunRadius - 2, sliceY, sunRadius * 2 + 4, sliceH);
          }
        }

        // LEVEL 8 GLITCH SYSTEM BOSS ("SYSTEM_ERR // THE GLITCH") + DEFEAT ANIMATION
        if (this.currentLevel.isGlitchBoss && (this.bossHp > 0 || this.state === 'boss_defeat_anim')) {
          const isDying = this.state === 'boss_defeat_anim';
          const deathProg = isDying ? Math.min(1, this.bossDefeatTimer / this.bossDefeatDuration) : 0;
          const jitterX = isDying
            ? (Math.random() - 0.5) * 65 * (1 - deathProg * 0.4)
            : (Math.random() - 0.5) * (8 + beatPulse * 14);
          const jitterY = isDying
            ? (Math.random() - 0.5) * 65 * (1 - deathProg * 0.4)
            : (Math.random() - 0.5) * (8 + beatPulse * 14);
          const bossX = width * 0.74 + Math.sin(this.bgTime * 3.1) * 38 + jitterX;
          const bossY = Math.max(ceilScreenY + 125, height * 0.33) + Math.cos(this.bgTime * 2.7) * 24 + jitterY;

          ctx.save();
          ctx.translate(bossX, bossY);

          // Ominous Red Lightning Bolts from Glitch Boss across the sky
          if (beatPulse > 0.45 || isDying) {
            ctx.strokeStyle = isDying ? '#00f0ff' : 'rgba(255, 0, 43, 0.75)';
            ctx.lineWidth = isDying ? 3 : 2;
            for (let b = 0; b < 3; b++) {
              ctx.beginPath();
              ctx.moveTo(0, 0);
              let lx = 0;
              let ly = 0;
              for (let seg = 0; seg < 5; seg++) {
                lx += (b - 1) * 65 + (Math.random() - 0.5) * 55;
                ly += 45 + Math.random() * 35;
                ctx.lineTo(lx, ly);
              }
              ctx.stroke();
            }
          }

          if (!isDying || deathProg < 0.85) {
            const scaleAmt = isDying ? Math.max(0.05, 1 + Math.sin(deathProg * Math.PI * 6) * 0.35 - deathProg * 0.75) : 1;
            ctx.scale(scaleAmt, scaleAmt);

            // Outer Corrupted System Rings
            for (let r = 0; r < 3; r++) {
              ctx.save();
              ctx.rotate(this.bgTime * (r % 2 === 0 ? 2.4 : -3.1) + r);
              ctx.strokeStyle = r === 0 ? '#ff002b' : r === 1 ? '#00f0ff' : '#ffaa00';
              ctx.lineWidth = 3;
              ctx.setLineDash([18 + r * 6, 12]);
              ctx.strokeRect(-58 - r * 14, -58 - r * 14, 116 + r * 28, 116 + r * 28);
              ctx.restore();
            }

            // RGB Chromatic Split Glitch Layers of the Boss Core
            const splitOffset = isDying ? 18 + deathProg * 45 : 5 + beatPulse * 8;
            const drawBossSkullPolygon = (ox, oy, fillCol, strokeCol) => {
              ctx.save();
              ctx.translate(ox, oy);
              ctx.fillStyle = fillCol;
              ctx.strokeStyle = strokeCol;
              ctx.lineWidth = 3;
              ctx.beginPath();
              ctx.moveTo(-46, -32);
              ctx.lineTo(0, -52);
              ctx.lineTo(46, -32);
              ctx.lineTo(54, 12);
              ctx.lineTo(30, 48);
              ctx.lineTo(12, 34);
              ctx.lineTo(0, 50);
              ctx.lineTo(-12, 34);
              ctx.lineTo(-30, 48);
              ctx.lineTo(-54, 12);
              ctx.closePath();
              ctx.fill();
              ctx.stroke();
              ctx.restore();
            };

            drawBossSkullPolygon(-splitOffset, 0, 'rgba(0, 240, 255, 0.35)', '#00f0ff');
            drawBossSkullPolygon(splitOffset, 0, 'rgba(255, 0, 85, 0.35)', '#ff0055');
            drawBossSkullPolygon(0, 0, '#160004', isDying ? '#ffffff' : '#ff002b');

            // Corrupted Glowing Eyes (Matches active attack 1-2-3-2-1 color)
            const eyeCol =
              this.bossAttackType === 1
                ? '#ffaa00'
                : this.bossAttackType === 2
                ? '#ff0077'
                : '#00f0ff';
            ctx.fillStyle = isDying ? '#ffffff' : eyeCol;
            ctx.fillRect(-28, -14, 18, 12);
            ctx.fillRect(10, -14, 18, 12);

            // Jagged Glitch Mouth
            ctx.strokeStyle = '#ff002b';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(-26, 18);
            ctx.lineTo(-14, 10);
            ctx.lineTo(-4, 22);
            ctx.lineTo(6, 10);
            ctx.lineTo(16, 22);
            ctx.lineTo(26, 14);
            ctx.stroke();
          }

          // Supernova Purification Ring at Climax of Boss Defeat Animation
          if (isDying) {
            const ringR = deathProg * 360;
            ctx.strokeStyle = `rgba(0, 240, 255, ${Math.max(0, 1 - deathProg)})`;
            ctx.lineWidth = 12 * (1 - deathProg * 0.7);
            ctx.beginPath();
            ctx.arc(0, 0, ringR, 0, Math.PI * 2);
            ctx.stroke();

            ctx.font = 'bold 14px "JetBrains Mono", monospace';
            ctx.fillStyle = '#00f0ff';
            ctx.textAlign = 'center';
            ctx.fillText(
              deathProg < 0.7
                ? '⚠ FATAL_ERR: GLITCH BOSS INTEGRITY COLLAPSING... ⚠'
                : '★ SYSTEM_RESTORED: GLITCH ENTITY TERMINATED! ★',
              0,
              -88
            );
          } else {
            ctx.font = 'bold 11px "JetBrains Mono", monospace';
            ctx.fillStyle = '#ff002b';
            ctx.textAlign = 'center';
            ctx.fillText(
              `KERNEL_GLITCH_BOSS [${Math.ceil(this.bossHp)}% HP] · PATTERN [1-2-3-2-1]`,
              0,
              -78
            );
            ctx.font = 'bold 10px "JetBrains Mono", monospace';
            ctx.fillStyle = '#ffaa00';
            ctx.fillText(
              `ACTIVE WAVE ${this.bossAttackWave}/5 -> ATTACK ${this.bossAttackType}`,
              0,
              -63
            );
          }
          ctx.restore();
        } else if (this.currentLevel.hasBoss && this.bossHp > 0) {
          // OMEGA CORE SENTINEL BOSS DRONE (Sector 06 Live Animated Boss)
          const bossX = width * 0.78 + Math.sin(this.bgTime * 2.5) * 28;
          const bossY = sunY + Math.cos(this.bgTime * 3.2) * 24;
          ctx.save();
          ctx.translate(bossX, bossY);

          // Rotating Outer Armored Shield Segments
          ctx.save();
          ctx.rotate(this.bgTime * 1.8);
          ctx.strokeStyle = '#ff0055';
          ctx.lineWidth = 4;
          ctx.setLineDash([24, 14]);
          ctx.beginPath();
          ctx.arc(0, 0, 52 + beatPulse * 6, 0, Math.PI * 2);
          ctx.stroke();
          ctx.restore();

          // Octagonal Cyber Boss Hull
          ctx.fillStyle = '#18040c';
          ctx.strokeStyle = '#ffaa00';
          ctx.lineWidth = 3;
          ctx.beginPath();
          for (let i = 0; i < 8; i++) {
            const ang = (i * Math.PI) / 4 + this.bgTime * 0.5;
            const rx = Math.cos(ang) * 38;
            const ry = Math.sin(ang) * 38;
            if (i === 0) ctx.moveTo(rx, ry);
            else ctx.lineTo(rx, ry);
          }
          ctx.closePath();
          ctx.fill();
          ctx.stroke();

          // Glowing Crimson Sentinel Eye
          ctx.fillStyle = '#ff0055';
          ctx.beginPath();
          ctx.arc(-6, 0, 13 + beatPulse * 4, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = '#ffffff';
          ctx.beginPath();
          ctx.arc(-8, -2, 5, 0, Math.PI * 2);
          ctx.fill();

          // Boss HUD Tag on Canvas
          ctx.font = 'bold 10px "JetBrains Mono", monospace';
          ctx.fillStyle = '#ffaa00';
          ctx.textAlign = 'center';
          ctx.fillText(`OMEGA SENTINEL [${Math.ceil(this.bossHp)}% HP]`, 0, -62);
          ctx.restore();
        }
        ctx.restore();

        // LAYER 4: Parallax Background Grid & Floating 3D Holographic Polyhedra
        ctx.strokeStyle = theme.gridColor;
        ctx.lineWidth = 1;
        const gridSize = 64;
        const scrollOffset = ((this.cameraX * 0.22) % gridSize + gridSize) % gridSize;
        ctx.beginPath();
        for (let x = -scrollOffset; x < width; x += gridSize) {
          ctx.moveTo(x, Math.max(0, ceilScreenY));
          ctx.lineTo(x, floorScreenY);
        }
        for (let y = Math.max(0, ceilScreenY); y < floorScreenY; y += gridSize) {
          ctx.moveTo(0, y);
          ctx.lineTo(width, y);
        }
        ctx.stroke();

        // Floating Wireframe Cyber Diamonds in Mid-Ground
        ctx.save();
        ctx.strokeStyle = theme.ridgeColor;
        ctx.lineWidth = 1.5;
        for (let p = 0; p < 5; p++) {
          const px = ((p * 340 - this.cameraX * 0.14) % (width + 200) + (width + 200)) % (width + 200) - 100;
          const py = ceilScreenY + 75 + (p % 3) * 65 + Math.sin(this.bgTime * 1.6 + p) * 14;
          const rad = 18 + (p % 2) * 8;
          ctx.save();
          ctx.translate(px, py);
          ctx.rotate(this.bgTime * 0.9 + p);
          ctx.strokeRect(-rad / 2, -rad / 2, rad, rad);
          ctx.beginPath();
          ctx.moveTo(0, -rad * 0.8);
          ctx.lineTo(rad * 0.8, 0);
          ctx.lineTo(0, rad * 0.8);
          ctx.lineTo(-rad * 0.8, 0);
          ctx.closePath();
          ctx.stroke();
          ctx.restore();
        }
        ctx.restore();

        // LAYER 5: Deterministic World-Space Wireframe Cyber Mountains
        const mtnSpan = 140;
        const mtnParallax = this.cameraX * 0.08;
        const firstMtnIdx = Math.floor(mtnParallax / mtnSpan) - 1;
        const mtnCount = Math.ceil(width / mtnSpan) + 3;

        ctx.save();
        ctx.beginPath();
        ctx.moveTo(0, floorScreenY);
        for (let i = 0; i <= mtnCount; i++) {
          const worldIdx = firstMtnIdx + i;
          const screenX = worldIdx * mtnSpan - mtnParallax;
          const hash = Math.abs(Math.sin(worldIdx * 12.9898 + this.currentLevel.id * 4.14) * 43758.5453) % 1;
          const peakH = 85 + hash * 115;
          ctx.lineTo(screenX, floorScreenY - peakH);
        }
        ctx.lineTo(width + mtnSpan, floorScreenY);
        ctx.closePath();
        ctx.fillStyle = theme.mountainColor;
        ctx.fill();
        ctx.strokeStyle = theme.ridgeColor;
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.restore();

        // LAYER 6: Live BPM-Reactive Audio Equalizer Spectrum
        const eqSpan = 28;
        const eqCount = Math.ceil(width / eqSpan);
        ctx.save();
        for (let i = 0; i < eqCount; i++) {
          const freqWave = Math.abs(Math.sin(i * 0.45 + this.bgTime * bps * Math.PI));
          const barH = 18 + freqWave * 85 * (0.55 + beatPulse * 0.45);
          ctx.fillStyle = i % 2 === 0 ? 'rgba(0, 240, 255, 0.15)' : 'rgba(255, 0, 119, 0.15)';
          ctx.fillRect(i * eqSpan + 4, floorScreenY - barH, eqSpan - 8, barH);
        }
        ctx.restore();

        // LAYER 7: Deterministic Cyberpunk Megacity Skyline + Flying Hover-Traffic Streaks
        const renderCityTier = (parallaxFactor, bWidth, gap, minH, maxH, fillCol, winCol, seedOffset) => {
          const stepSpan = bWidth + gap;
          const camShift = this.cameraX * parallaxFactor;
          const startIdx = Math.floor(camShift / stepSpan) - 1;
          const count = Math.ceil(width / stepSpan) + 3;

          for (let i = 0; i < count; i++) {
            const bIdx = startIdx + i;
            const bx = bIdx * stepSpan - camShift;
            const h1 = Math.abs(Math.sin((bIdx + seedOffset) * 78.233) * 43758.5453) % 1;
            const h2 = Math.abs(Math.cos((bIdx + seedOffset) * 19.13) * 19341.12) % 1;
            const bh = minH + h1 * (maxH - minH);
            const by = floorScreenY - bh;

            ctx.fillStyle = fillCol;
            ctx.fillRect(bx, by, bWidth, bh);

            ctx.fillStyle = winCol;
            ctx.fillRect(bx, by, bWidth, 2);
            if (h2 > 0.55) {
              ctx.fillRect(bx + bWidth * 0.5 - 1, by - 18, 2, 18);
            }

            ctx.fillStyle = winCol;
            const cols = Math.floor((bWidth - 12) / 10);
            const rows = Math.floor((bh - 16) / 14);
            for (let r = 0; r < rows; r++) {
              for (let c = 0; c < cols; c++) {
                const winHash = (bIdx * 31 + r * 17 + c * 13) & 7;
                if (winHash < 3) {
                  ctx.fillRect(bx + 6 + c * 10, by + 10 + r * 14, 5, 6);
                }
              }
            }
          }
        };

        renderCityTier(0.15, 64, 14, 65, 175, 'rgba(6, 10, 20, 0.82)', 'rgba(0, 240, 255, 0.16)', 10);
        renderCityTier(0.26, 52, 22, 45, 130, 'rgba(4, 7, 15, 0.92)', 'rgba(255, 0, 119, 0.22)', 77);

        // Hover-Traffic Light Streaks
        ctx.save();
        for (let t = 0; t < 6; t++) {
          const dir = t % 2 === 0 ? 1 : -1;
          const speed = 160 + t * 45;
          const tx = ((t * 290 + dir * this.bgTime * speed - this.cameraX * 0.2) % (width + 120) + (width + 120)) % (width + 120) - 60;
          const ty = floorScreenY - 35 - t * 22;
          ctx.fillStyle = dir === 1 ? 'rgba(0, 240, 255, 0.55)' : 'rgba(255, 0, 119, 0.55)';
          ctx.fillRect(tx, ty, 24, 2);
        }
        ctx.restore();
      }

      renderFloorsAndCeilings(screenWidth) {
        const ctx = this.ctx;
        const viewLeft = this.cameraX - 100;
        const viewRight = this.cameraX + screenWidth + 250;
        const ceilY = this.currentLevel.ceilingY;

        ctx.fillStyle = '#070b14';
        ctx.fillRect(viewLeft, -220, viewRight - viewLeft, 220);

        ctx.strokeStyle = 'rgba(0, 240, 255, 0.22)';
        ctx.lineWidth = 1.5;
        const tickStep = 80;
        const firstTick = Math.floor(viewLeft / tickStep) * tickStep;
        ctx.beginPath();
        for (let tx = firstTick; tx < viewRight; tx += tickStep) {
          ctx.moveTo(tx, 0);
          ctx.lineTo(tx - 35, -100);
          ctx.moveTo(tx, ceilY);
          ctx.lineTo(tx - 35, ceilY + 100);
        }
        ctx.stroke();

        ctx.strokeStyle = this.customization.primaryColor;
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(viewLeft, 0);
        ctx.lineTo(viewRight, 0);
        ctx.stroke();

        ctx.fillStyle = '#070b14';
        ctx.fillRect(viewLeft, ceilY, viewRight - viewLeft, 220);

        ctx.strokeStyle = this.customization.primaryColor;
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(viewLeft, ceilY);
        ctx.lineTo(viewRight, ceilY);
        ctx.stroke();

        // Finish Line Portal Gate at level.length
        const finX = this.currentLevel.length;
        if (finX >= viewLeft && finX <= viewRight) {
          ctx.save();
          ctx.fillStyle = 'rgba(0, 255, 102, 0.25)';
          ctx.fillRect(finX - 15, 0, 30, ceilY);
          ctx.strokeStyle = '#00ff66';
          ctx.lineWidth = 4;
          ctx.beginPath();
          ctx.moveTo(finX, 0);
          ctx.lineTo(finX, ceilY);
          ctx.stroke();
          ctx.scale(1, -1);
          ctx.font = 'bold 12px "JetBrains Mono", monospace';
          ctx.fillStyle = '#00ff66';
          ctx.fillText('★ SECTOR FINISH GATE ★', finX - 75, -ceilY / 2);
          ctx.restore();
        }

        if (viewLeft < 1220) {
          ctx.save();
          ctx.scale(1, -1);
          ctx.font = 'bold 11px "JetBrains Mono", monospace';
          ctx.fillStyle = 'rgba(0, 240, 255, 0.55)';
          ctx.fillText('>>> RUNWAY SYNC ZONE · PREPARE FOR SECTOR OBSTACLES >>>', 260, 26);
          ctx.fillStyle = 'rgba(255, 170, 0, 0.75)';
          ctx.fillText('▼ COURSE START (1250m)', 1110, 26);
          ctx.restore();
        }
      }

      renderGhostReplay() {
        const ghost = this.bestGhostByLevel[this.currentLevel.id];
        if (!ghost || ghost.length === 0) return;
        const ctx = this.ctx;
        let closest = null;
        let bestDiff = 999;
        for (const node of ghost) {
          const d = Math.abs(node.x - this.player.x);
          if (d < bestDiff) {
            bestDiff = d;
            closest = node;
          }
        }
        if (!closest || bestDiff > 80) return;
        ctx.save();
        ctx.globalAlpha = 0.28;
        ctx.translate(closest.x + PLAYER_SIZE / 2, closest.y + PLAYER_SIZE / 2);
        ctx.rotate((closest.rotation * Math.PI) / 180);
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 2;
        ctx.strokeRect(-PLAYER_SIZE / 2, -PLAYER_SIZE / 2, PLAYER_SIZE, PLAYER_SIZE);
        ctx.restore();
      }

      renderLevelObjects(screenWidth) {
        const ctx = this.ctx;
        const viewLeft = this.cameraX - 100;
        const viewRight = this.cameraX + (screenWidth || 1400) + 200;

        for (const obj of this.currentLevel.objects) {
          if (obj.x + obj.w < viewLeft || obj.x > viewRight) continue;

          const isPhaseIntangible =
            obj.phase && obj.phase !== 'none' && obj.phase !== this.player.phase;

          ctx.save();
          if (isPhaseIntangible) {
            ctx.globalAlpha = 0.22;
          }

          if (obj.type === 'bollard') {
            // Boss Attack 1: Low Hyper-Velocity Cyber Bollard
            const isDilated = this.player.isTimeDilated;
            const bolCol = isDilated ? '#00f0ff' : '#ff002b';
            ctx.fillStyle = '#1a0208';
            ctx.strokeStyle = bolCol;
            ctx.lineWidth = 3;
            ctx.fillRect(obj.x, obj.y, obj.w, obj.h);
            ctx.strokeRect(obj.x, obj.y, obj.w, obj.h);

            // Hazard chevrons inside bollard
            ctx.fillStyle = '#ffaa00';
            ctx.fillRect(obj.x + 5, obj.y + 10, obj.w - 10, 8);
            ctx.fillRect(obj.x + 5, obj.y + 28, obj.w - 10, 8);

            // Glowing plasma cap on top of bollard
            ctx.fillStyle = isDilated ? '#38bdf8' : '#ff0055';
            ctx.fillRect(obj.x - 2, obj.y + obj.h - 6, obj.w + 4, 8);

            // If Time Slow is NOT active, draw the vertical crimson speed-lock barrier & warning label
            if (!isDilated) {
              ctx.save();
              ctx.fillStyle = 'rgba(255, 0, 43, 0.24)';
