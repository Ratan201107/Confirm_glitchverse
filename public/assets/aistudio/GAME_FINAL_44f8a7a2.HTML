              ctx.fillRect(obj.x + 2, obj.y + obj.h, obj.w - 4, 125);
              ctx.strokeStyle = 'rgba(255, 0, 43, 0.85)';
              ctx.setLineDash([6, 4]);
              ctx.strokeRect(obj.x + 2, obj.y + obj.h, obj.w - 4, 125);
              ctx.scale(1, -1);
              ctx.font = 'bold 10px "JetBrains Mono", monospace';
              ctx.fillStyle = '#ffaa00';
              ctx.textAlign = 'center';
              ctx.fillText('SLOW-MO [E]!', obj.x + obj.w / 2, -(obj.y + obj.h + 135));
              ctx.restore();
            } else {
              ctx.save();
              ctx.scale(1, -1);
              ctx.font = 'bold 9px "JetBrains Mono", monospace';
              ctx.fillStyle = '#38bdf8';
              ctx.textAlign = 'center';
              ctx.fillText('0.5X JUMP ▲', obj.x + obj.w / 2, -(obj.y + obj.h + 16));
              ctx.restore();
            }
          } else if (obj.type === 'spike') {
            const spikeCol =
              obj.phase === 'cyan' ? '#00f0ff' : obj.phase === 'magenta' ? '#ff0077' : '#ff0055';

            if (obj.visual === 'saw') {
              // Rotating Cyber Sawblade
              const cx = obj.x + obj.w / 2;
              const cy = obj.y + obj.h / 2;
              const rad = obj.w / 2;
              ctx.save();
              ctx.translate(cx, cy);
              ctx.rotate(this.bgTime * 9.0);
              ctx.fillStyle = '#141829';
              ctx.strokeStyle = spikeCol;
              ctx.lineWidth = 2.5;
              ctx.beginPath();
              const teeth = 10;
              for (let i = 0; i < teeth * 2; i++) {
                const r = i % 2 === 0 ? rad : rad * 0.65;
                const ang = (i * Math.PI) / teeth;
                const tx = Math.cos(ang) * r;
                const ty = Math.sin(ang) * r;
                if (i === 0) ctx.moveTo(tx, ty);
                else ctx.lineTo(tx, ty);
              }
              ctx.closePath();
              ctx.fill();
              ctx.stroke();
              ctx.fillStyle = '#ffffff';
              ctx.beginPath();
              ctx.arc(0, 0, 5, 0, Math.PI * 2);
              ctx.fill();
              ctx.restore();
            } else {
              ctx.fillStyle = '#10141f';
              ctx.strokeStyle = spikeCol;
              ctx.lineWidth = 2.5;

              ctx.beginPath();
              if (obj.spikeDir === 'down') {
                ctx.moveTo(obj.x, obj.y + obj.h);
                ctx.lineTo(obj.x + obj.w / 2, obj.y);
                ctx.lineTo(obj.x + obj.w, obj.y + obj.h);
              } else {
                ctx.moveTo(obj.x, obj.y);
                ctx.lineTo(obj.x + obj.w / 2, obj.y + obj.h);
                ctx.lineTo(obj.x + obj.w, obj.y);
              }
              ctx.closePath();
              ctx.fill();
              ctx.stroke();
            }
          } else if (obj.type === 'block') {
            const borderCol =
              obj.phase === 'cyan'
                ? '#00f0ff'
                : obj.phase === 'magenta'
                ? '#ff0077'
                : this.customization.primaryColor;

            ctx.fillStyle = '#0f1422';
            ctx.fillRect(obj.x, obj.y, obj.w, obj.h);

            ctx.strokeStyle = borderCol;
            ctx.lineWidth = 2;
            if (isPhaseIntangible) {
              ctx.setLineDash([6, 4]);
            }
            ctx.strokeRect(obj.x, obj.y, obj.w, obj.h);
            ctx.setLineDash([]);

            ctx.strokeStyle = 'rgba(255, 255, 255, 0.08)';
            ctx.beginPath();
            ctx.moveTo(obj.x, obj.y);
            ctx.lineTo(obj.x + obj.w, obj.y + obj.h);
            ctx.moveTo(obj.x + obj.w, obj.y);
            ctx.lineTo(obj.x, obj.y + obj.h);
            ctx.stroke();
          } else if (obj.type === 'jump_pad') {
            const padCol = obj.padType === 'pink' ? '#ff0077' : '#ffaa00';
            ctx.fillStyle = padCol;
            ctx.fillRect(obj.x, obj.y, obj.w, obj.h);
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 2;
            ctx.strokeRect(obj.x, obj.y, obj.w, obj.h);
          } else if (obj.type === 'jump_ring') {
            const ringCol =
              obj.ringType === 'dash'
                ? '#00ff66'
                : obj.ringType === 'blue'
                ? '#00f0ff'
                : obj.ringType === 'purple'
                ? '#a855f7'
                : '#ffaa00';
            const cx = obj.x + obj.w / 2;
            const cy = obj.y + obj.h / 2;

            ctx.strokeStyle = ringCol;
            ctx.lineWidth = 3.5;
            ctx.beginPath();
            ctx.arc(cx, cy, obj.w / 2, 0, Math.PI * 2);
            ctx.stroke();

            if (obj.ringType === 'dash') {
              ctx.strokeStyle = '#ffffff';
              ctx.lineWidth = 1.5;
              ctx.beginPath();
              ctx.arc(cx, cy, obj.w / 3, 0, Math.PI * 2);
              ctx.stroke();
            }

            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(cx, cy, 5, 0, Math.PI * 2);
            ctx.fill();
          } else if (
            obj.type === 'portal_gravity' ||
            obj.type === 'portal_vehicle' ||
            obj.type === 'portal_phase' ||
            obj.type === 'speed_gate'
          ) {
            let pColor = '#00f0ff';
            let label = 'PORTAL';
            if (obj.type === 'portal_gravity') {
              pColor = obj.portalGravity === -1 ? '#38bdf8' : '#10b981';
              label = obj.portalGravity === -1 ? 'GRAV ▲' : 'GRAV ▼';
            } else if (obj.type === 'portal_vehicle') {
              pColor =
                obj.portalVehicle === 'glider'
                  ? '#ffaa00'
                  : obj.portalVehicle === 'wave'
                  ? '#38bdf8'
                  : obj.portalVehicle === 'ufo'
                  ? '#a855f7'
                  : obj.portalVehicle === 'ball'
                  ? '#ff0055'
                  : '#00ff66';
              label = obj.portalVehicle.toUpperCase();
            } else if (obj.type === 'portal_phase') {
              pColor = obj.phase === 'cyan' ? '#00f0ff' : '#ff0077';
              label = obj.phase === 'cyan' ? 'CYAN' : 'MAGENTA';
            } else if (obj.type === 'speed_gate') {
              pColor = '#10b981';
              label = obj.speedMultiplier > 1 ? 'BOOST >>' : '1.0X >';
            }

            const cx = obj.x + obj.w / 2;
            const cy = obj.y + obj.h / 2;

            ctx.fillStyle = pColor;
            ctx.globalAlpha = 0.14;
            ctx.fillRect(obj.x + 6, obj.y, obj.w - 12, obj.h);

            ctx.globalAlpha = 0.9;
            ctx.strokeStyle = pColor;
            ctx.lineWidth = 3.5;
            ctx.beginPath();
            ctx.ellipse(cx, cy, obj.w / 2, Math.min(95, obj.h / 2.2), 0, 0, Math.PI * 2);
            ctx.stroke();

            ctx.fillStyle = pColor;
            ctx.fillRect(obj.x, obj.y, obj.w, 10);
            ctx.fillRect(obj.x, obj.y + obj.h - 10, obj.w, 10);

            ctx.save();
            ctx.scale(1, -1);
            ctx.font = 'bold 10px "JetBrains Mono", monospace';
            ctx.fillStyle = '#ffffff';
            ctx.textAlign = 'center';
            ctx.fillText(label, cx, -(cy + 108));
            ctx.restore();
          } else if (obj.type === 'coin' && !obj.activated) {
            const cx = obj.x + obj.w / 2;
            const cy = obj.y + obj.h / 2;
            ctx.fillStyle = '#ffd700';
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 2;

            ctx.beginPath();
            ctx.arc(cx, cy, 14, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            ctx.fillStyle = '#000000';
            ctx.font = 'bold 12px monospace';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.save();
            ctx.scale(1, -1);
            ctx.fillText('★', cx, -cy);
            ctx.restore();
          }

          ctx.restore();
        }
      }

      renderCheckpoints() {
        const ctx = this.ctx;
        this.checkpoints.forEach((cp, idx) => {
          const cx = cp.x + PLAYER_SIZE / 2;
          const cy = cp.y + PLAYER_SIZE / 2;
          ctx.fillStyle = '#10b981';
          ctx.strokeStyle = '#ffffff';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(cx, cy + 12);
          ctx.lineTo(cx + 12, cy);
          ctx.lineTo(cx, cy - 12);
          ctx.lineTo(cx - 12, cy);
          ctx.closePath();
          ctx.fill();
          ctx.stroke();

          ctx.save();
          ctx.scale(1, -1);
          ctx.font = 'bold 9px "JetBrains Mono", monospace';
          ctx.fillStyle = '#10b981';
          ctx.textAlign = 'center';
          ctx.fillText(`CP#${idx + 1}`, cx, -(cy + 18));
          ctx.restore();
        });
      }

      renderParticles() {
        const ctx = this.ctx;
        const trail = this.customization.trail;

        if (trail === 'ghost') {
          for (const node of this.trailNodes) {
            if (node.alpha <= 0.05) continue;
            ctx.save();
            ctx.globalAlpha = node.alpha * 0.35;
            ctx.translate(node.x + PLAYER_SIZE / 2, node.y + PLAYER_SIZE / 2);
            ctx.rotate((node.rotation * Math.PI) / 180);
            ctx.fillStyle = this.customization.primaryColor;
            ctx.fillRect(-PLAYER_SIZE / 2, -PLAYER_SIZE / 2, PLAYER_SIZE, PLAYER_SIZE);
            ctx.restore();
          }
        } else if ((trail === 'laser' || trail === 'rainbow') && this.trailNodes.length > 1) {
          ctx.save();
          ctx.strokeStyle = this.customization.primaryColor;
          ctx.lineWidth = 4;
          ctx.beginPath();
          for (let i = 0; i < this.trailNodes.length; i++) {
            const n = this.trailNodes[i];
            const nx = n.x + PLAYER_SIZE / 2;
            const ny = n.y + PLAYER_SIZE / 2 + 6;
            if (i === 0) ctx.moveTo(nx, ny);
            else ctx.lineTo(nx, ny);
          }
          ctx.stroke();

          ctx.strokeStyle = trail === 'rainbow' ? '#00ff66' : '#ff0077';
          ctx.lineWidth = 2.5;
          ctx.beginPath();
          for (let i = 0; i < this.trailNodes.length; i++) {
            const n = this.trailNodes[i];
            const nx = n.x + PLAYER_SIZE / 2;
            const ny = n.y + PLAYER_SIZE / 2 - 6;
            if (i === 0) ctx.moveTo(nx, ny);
            else ctx.lineTo(nx, ny);
          }
          ctx.stroke();
          ctx.restore();
        }

        for (const sw of this.shockwaves) {
          ctx.save();
          ctx.globalAlpha = Math.max(0, sw.alpha);
          ctx.strokeStyle = sw.color;
          ctx.lineWidth = 3.5;
          ctx.beginPath();
          ctx.arc(sw.x, sw.y, sw.radius, 0, Math.PI * 2);
          ctx.stroke();
          ctx.restore();
        }

        for (const p of this.particles) {
          ctx.save();
          ctx.globalAlpha = Math.max(0, p.alpha);
          ctx.fillStyle = p.color;
          ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
          ctx.restore();
        }
      }

      renderAutoplayVectorOverlay() {
        const ctx = this.ctx;
        const cx = this.player.x + PLAYER_SIZE / 2;
        const cy = this.player.y + PLAYER_SIZE / 2;

        ctx.save();
        // AI Halo around player
        ctx.strokeStyle = 'rgba(255, 170, 0, 0.7)';
        ctx.lineWidth = 1.5;
        ctx.setLineDash([4, 4]);
        ctx.beginPath();
        ctx.arc(cx, cy, PLAYER_SIZE * 0.85, 0, Math.PI * 2);
        ctx.stroke();

        // Targeting line to active AI hazard/coin/ring
        if (this.aiTargetObj) {
          const tx = this.aiTargetObj.x + this.aiTargetObj.w / 2;
          const ty = this.aiTargetObj.y + this.aiTargetObj.h / 2;
          ctx.strokeStyle = 'rgba(255, 170, 0, 0.55)';
          ctx.beginPath();
          ctx.moveTo(cx, cy);
          ctx.lineTo(tx, ty);
          ctx.stroke();

          ctx.setLineDash([]);
          ctx.strokeStyle = '#ffaa00';
          ctx.strokeRect(tx - 14, ty - 14, 28, 28);
        }

        ctx.setLineDash([]);
        ctx.scale(1, -1);
        ctx.font = 'bold 10px "JetBrains Mono", monospace';
        ctx.fillStyle = '#ffaa00';
        ctx.textAlign = 'center';
        ctx.fillText(`AI: ${this.aiStatus}`, cx, -(cy + 30));
        ctx.restore();
      }

      renderFloatingTexts() {
        const ctx = this.ctx;
        for (const ft of this.floatingTexts) {
          ctx.save();
          ctx.globalAlpha = Math.max(0, ft.life / ft.maxLife);
          ctx.scale(1, -1);
          ctx.font = 'bold 12px "JetBrains Mono", monospace';
          ctx.fillStyle = ft.color;
          ctx.textAlign = 'center';
          ctx.fillText(ft.text, ft.x + PLAYER_SIZE / 2, -ft.y);
          ctx.restore();
        }
      }

      renderPlayer() {
        const ctx = this.ctx;
        ctx.save();
        const cx = this.player.x + PLAYER_SIZE / 2;
        const cy = this.player.y + PLAYER_SIZE / 2;

        ctx.translate(cx, cy);
        ctx.rotate((this.player.rotation * Math.PI) / 180);

        const primary = this.customization.primaryColor;
        const secondary = this.customization.secondaryColor;
        const phaseGlow = this.player.phase === 'cyan' ? '#00f0ff' : '#ff0077';

        ctx.strokeStyle = phaseGlow;
        ctx.lineWidth = 3.5;
        ctx.shadowColor = phaseGlow;
        ctx.shadowBlur = 12;

        const half = PLAYER_SIZE / 2;

        if (this.player.vehicleMode === 'glider') {
          ctx.fillStyle = secondary;
          ctx.beginPath();
          ctx.moveTo(half, 0);
          ctx.lineTo(-half, half);
          ctx.lineTo(-PLAYER_SIZE / 3, 0);
          ctx.lineTo(-half, -half);
          ctx.closePath();
          ctx.fill();
          ctx.stroke();

          ctx.fillStyle = primary;
          ctx.fillRect(-PLAYER_SIZE / 4, -4, 14, 8);
        } else if (this.player.vehicleMode === 'wave') {
          ctx.fillStyle = primary;
          ctx.beginPath();
          ctx.moveTo(half, 0);
          ctx.lineTo(0, half);
          ctx.lineTo(-half, 0);
          ctx.lineTo(0, -half);
          ctx.closePath();
          ctx.fill();
          ctx.stroke();

          ctx.fillStyle = '#ffffff';
          ctx.beginPath();
          ctx.arc(0, 0, 4, 0, Math.PI * 2);
          ctx.fill();
        } else if (this.player.vehicleMode === 'ufo') {
          // UFO Pulse Hopper Saucer
          ctx.fillStyle = primary;
          ctx.beginPath();
          ctx.arc(0, 3, half * 0.65, 0, Math.PI, false);
          ctx.fill();
          ctx.stroke();

          ctx.fillStyle = secondary;
          ctx.beginPath();
          ctx.ellipse(0, -2, half, half * 0.42, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();

          ctx.fillStyle = '#ffffff';
          ctx.fillRect(-half * 0.5, -4, half, 4);
        } else if (this.player.vehicleMode === 'ball') {
          // Geometry Dash "Up-Roll" Spiked Gravity Wheel
          ctx.fillStyle = secondary;
          ctx.beginPath();
          const spikes = 8;
          for (let i = 0; i < spikes * 2; i++) {
            const r = i % 2 === 0 ? half : half * 0.68;
            const ang = (i * Math.PI) / spikes;
            const rx = Math.cos(ang) * r;
            const ry = Math.sin(ang) * r;
            if (i === 0) ctx.moveTo(rx, ry);
            else ctx.lineTo(rx, ry);
          }
          ctx.closePath();
          ctx.fill();
          ctx.stroke();

          ctx.fillStyle = primary;
          ctx.beginPath();
          ctx.arc(0, 0, half * 0.42, 0, Math.PI * 2);
          ctx.fill();

          ctx.fillStyle = '#ffffff';
          ctx.beginPath();
          ctx.arc(0, 0, 4, 0, Math.PI * 2);
          ctx.fill();
        } else {
          const skin = this.customization.vehicle;
          if (skin === 'hex' || skin === 'omega') {
            ctx.fillStyle = secondary;
            ctx.beginPath();
            const sides = skin === 'omega' ? 8 : 6;
            for (let i = 0; i < sides; i++) {
              const ang = (i * Math.PI * 2) / sides;
              const rx = Math.cos(ang) * half;
              const ry = Math.sin(ang) * half;
              if (i === 0) ctx.moveTo(rx, ry);
              else ctx.lineTo(rx, ry);
            }
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            ctx.fillStyle = primary;
            ctx.beginPath();
            ctx.arc(0, 0, half * 0.48, 0, Math.PI * 2);
            ctx.fill();
          } else if (skin === 'star') {
            ctx.fillStyle = primary;
            ctx.beginPath();
            for (let i = 0; i < 8; i++) {
              const r = i % 2 === 0 ? half : half * 0.48;
              const ang = (i * Math.PI) / 4;
              const rx = Math.cos(ang) * r;
              const ry = Math.sin(ang) * r;
              if (i === 0) ctx.moveTo(rx, ry);
              else ctx.lineTo(rx, ry);
            }
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(0, 0, 5, 0, Math.PI * 2);
            ctx.fill();
          } else if (skin === 'droid') {
            ctx.fillStyle = secondary;
            ctx.fillRect(-half, -half, PLAYER_SIZE, PLAYER_SIZE);
            ctx.strokeRect(-half, -half, PLAYER_SIZE, PLAYER_SIZE);

            ctx.fillStyle = '#ffffff';
            ctx.fillRect(-half + 6, 2, PLAYER_SIZE - 12, 8);
            ctx.fillStyle = primary;
            ctx.fillRect(-half + 8, -10, PLAYER_SIZE - 16, 6);
          } else {
            ctx.fillStyle = secondary;
            ctx.fillRect(-half, -half, PLAYER_SIZE, PLAYER_SIZE);
            ctx.strokeRect(-half, -half, PLAYER_SIZE, PLAYER_SIZE);

            ctx.fillStyle = primary;
            ctx.fillRect(-half / 2, -half / 2, half, half);

            ctx.fillStyle = '#ffffff';
            ctx.fillRect(2, -PLAYER_SIZE / 6, 8, PLAYER_SIZE / 3);
          }
        }

        ctx.restore();
      }

      renderScreenVignette(width, height) {
        const ctx = this.ctx;

        // Real-Time Screen Glitch Effects during Level 8 Boss Battle!
        if (this.currentLevel.isGlitchBoss && (this.state === 'playing' || this.state === 'boss_defeat_anim')) {
          ctx.save();
          // Ominous Red Edge Vignette
          const redGrad = ctx.createRadialGradient(
            width / 2,
            height / 2,
            width * 0.28,
            width / 2,
            height / 2,
            width * 0.72
          );
          redGrad.addColorStop(0, 'rgba(255, 0, 43, 0)');
          redGrad.addColorStop(1, 'rgba(255, 0, 43, 0.22)');
          ctx.fillStyle = redGrad;
          ctx.fillRect(0, 0, width, height);

          // Procedural Horizontal Glitch Scanline Tears & RGB Artifacts
          const glitchChance = this.state === 'boss_defeat_anim' ? 0.95 : 0.45;
          if (Math.random() < glitchChance) {
            const barCount = this.state === 'boss_defeat_anim' ? 9 : 4;
            for (let g = 0; g < barCount; g++) {
              const gy = Math.random() * height;
              const gh = 2 + Math.random() * 14;
              const gx = (Math.random() - 0.5) * 40;
              ctx.fillStyle =
                g % 3 === 0
                  ? 'rgba(255, 0, 43, 0.28)'
                  : g % 3 === 1
                  ? 'rgba(0, 240, 255, 0.24)'
                  : 'rgba(255, 255, 255, 0.18)';
              ctx.fillRect(gx, gy, width, gh);
            }
          }

          // Top-Center Live 1-2-3-2-1 Boss Attack Pattern Sequencer Banner
          if (this.state === 'playing') {
            const bannerW = Math.min(580, width - 32);
            const bannerX = (width - bannerW) / 2;
            const bannerY = 66;
            ctx.fillStyle = 'rgba(24, 0, 6, 0.88)';
            ctx.strokeStyle = '#ff002b';
            ctx.lineWidth = 1.5;
            ctx.fillRect(bannerX, bannerY, bannerW, 38);
            ctx.strokeRect(bannerX, bannerY, bannerW, 38);

            ctx.font = 'bold 11px "JetBrains Mono", monospace';
            ctx.fillStyle = '#ffaa00';
            ctx.textAlign = 'center';
            ctx.fillText(
              `GLITCH SYSTEM BOSS [1-2-3-2-1] · WAVE ${this.bossAttackWave}/5`,
              width / 2,
              bannerY + 15
            );
            ctx.font = 'bold 10px "JetBrains Mono", monospace';
            ctx.fillStyle = '#ffffff';
            ctx.fillText(this.bossAttackLabel || 'SURVIVE THE CORRUPTED COURSE!', width / 2, bannerY + 31);
          }
          ctx.restore();
        }

        if (this.player.isTimeDilated) {
          const grad = ctx.createRadialGradient(
            width / 2,
            height / 2,
            width * 0.25,
            width / 2,
            height / 2,
            width * 0.7
          );
          grad.addColorStop(0, 'rgba(56, 189, 248, 0)');
          grad.addColorStop(1, 'rgba(56, 189, 248, 0.28)');
          ctx.fillStyle = grad;
          ctx.fillRect(0, 0, width, height);
        }

        const borderCol =
          this.player.phase === 'cyan' ? 'rgba(0, 240, 255, 0.14)' : 'rgba(255, 0, 119, 0.14)';
        ctx.strokeStyle = borderCol;
        ctx.lineWidth = 8;
        ctx.strokeRect(0, 0, width, height);

        if (this.state === 'crashed') {
          ctx.save();
          ctx.fillStyle = 'rgba(0, 0, 0, 0.65)';
          ctx.fillRect(0, height / 2 - 55, width, 110);
          ctx.strokeStyle = '#ff0055';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(0, height / 2 - 55);
          ctx.lineTo(width, height / 2 - 55);
          ctx.moveTo(0, height / 2 + 55);
          ctx.lineTo(width, height / 2 + 55);
          ctx.stroke();

          ctx.fillStyle = '#ffffff';
          ctx.font = 'bold 22px "JetBrains Mono", monospace';
          ctx.textAlign = 'center';
          ctx.fillText('SIGNAL DESYNCHRONIZED · HULL FRACTURE', width / 2, height / 2 - 8);

          ctx.fillStyle = '#00f0ff';
          ctx.font = 'bold 13px "JetBrains Mono", monospace';
          ctx.fillText('PRESS [SPACE], [R], OR CLICK TO REDEPLOY (OR [A] FOR AI AUTOPLAY)', width / 2, height / 2 + 24);
          ctx.restore();
        }
      }
    }

    // =========================================================================
    // 6. APPLICATION STATE & DECLARATIVE UI CONTROLLER
    // =========================================================================
    const appState = {
      view: 'title', // 'title' | 'level_select' | 'garage' | 'achievements' | 'editor' | 'gameplay'
      garageTab: 'vehicle', // 'vehicle' | 'colors' | 'trail' | 'death'
      showHowTo: false,
      editorTool: 'spike',
      editorPhase: 'none',
      editorMessage: '',
      profile: loadPlayerProfile(),
      currentLevel: LEVELS.find(l => l.id === 9) || LEVELS[0],
      engineState: 'idle',
      telemetry: {
        percent: 0,
        attempts: 1,
        coinsCollected: [false, false, false],
        isPractice: false,
        isAutoplay: false,
        activePhase: 'cyan',
        isTimeDilated: false,
        vehicleMode: 'cube',
        score: 0,
        combo: 1,
        bossHp: 100,
        aiStatus: 'STANDBY',
        fps: 60,
      },
      victoryStats: null,
    };

    let engine = null;

    function updateHudDOM() {
      if (appState.view !== 'gameplay') return;
      const t = appState.telemetry;

      const attemptEl = document.getElementById('hud-attempt');
      if (attemptEl) attemptEl.textContent = `ATTEMPT ${t.attempts}`;

      const scoreEl = document.getElementById('hud-score');
      if (scoreEl) scoreEl.textContent = `SCORE ${t.score.toLocaleString()}`;

      const comboEl = document.getElementById('hud-combo');
      if (comboEl) comboEl.textContent = `${t.combo}X COMBO`;

      const pctEl = document.getElementById('hud-percent');
      if (pctEl) pctEl.textContent = `${t.percent}%`;

      const barEl = document.getElementById('hud-progress-bar');
      if (barEl) barEl.style.width = `${t.percent}%`;

      for (let i = 0; i < 3; i++) {
        const coinEl = document.getElementById(`hud-coin-${i}`);
        if (coinEl) {
          coinEl.className = t.coinsCollected[i]
            ? 'text-amber-400 drop-shadow-[0_0_6px_#ffaa00] text-sm'
            : 'text-zinc-700 text-sm';
        }
      }

      const phaseBadge = document.getElementById('hud-phase-btn');
      const phaseDot = document.getElementById('hud-phase-dot');
      const phaseText = document.getElementById('hud-phase-text');
      if (phaseBadge && phaseDot && phaseText) {
        if (t.activePhase === 'cyan') {
          phaseBadge.className =
            'px-3 py-1.5 rounded border font-mono text-xs font-bold uppercase tracking-wider flex items-center gap-1.5 transition-colors cursor-pointer bg-cyan-950/80 border-cyan-400 text-cyan-300 shadow-[0_0_10px_rgba(0,240,255,0.3)]';
          phaseDot.className = 'w-2 h-2 rounded-full bg-cyan-400';
          phaseText.textContent = 'CYAN [SHIFT / F]';
        } else {
          phaseBadge.className =
            'px-3 py-1.5 rounded border font-mono text-xs font-bold uppercase tracking-wider flex items-center gap-1.5 transition-colors cursor-pointer bg-fuchsia-950/80 border-fuchsia-400 text-fuchsia-300 shadow-[0_0_10px_rgba(255,0,119,0.3)]';
          phaseDot.className = 'w-2 h-2 rounded-full bg-fuchsia-400';
          phaseText.textContent = 'MAGENTA [SHIFT / F]';
        }
      }

      const slowBtn = document.getElementById('hud-slow-btn');
      if (slowBtn) {

        appState.profile = { ...appState.profile, customization: nextCustom };
        savePlayerProfile(appState.profile);
        if (engine) engine.setCustomization(nextCustom);
        renderUI();

        if (engine) engine.togglePause();
        renderUI();

        if (engine) {

        const idx = LEVELS.findIndex((l) => l.id === appState.currentLevel.id);
        if (idx >= 0 && idx + 1 < LEVELS.length) {
          window.appActions.launchLevel(LEVELS[idx + 1].id, engine ? engine.isAutoplayMode : false);
        } else {
          window.appActions.openLevelSelect();
        }

        if (engine) {
          engine.setPracticeMode(!engine.isPracticeMode);

        if (engine) {
          engine.setAutoplayMode(!engine.isAutoplayMode);

          engine.toggleTimeSlow();

        if (engine) engine.addCheckpoint();

        if (engine) engine.removeCheckpoint();

      triggerPhaseShift() {
        if (engine) engine.triggerManualPhaseShift();
      },
      triggerJumpDown(e) {
        if (e && e.preventDefault) e.preventDefault();
        if (engine) engine.triggerManualJumpDown();
      },
      triggerJumpUp(e) {
        if (e && e.preventDefault) e.preventDefault();
        if (engine) engine.triggerManualJumpUp();

        if (!engine) return;

      addEditorObject(xPos) {
        const cl = appState.profile.customLevel;
        const tool = appState.editorTool;
        const phase = appState.editorPhase === 'none' ? undefined : appState.editorPhase;
        const id = 'cust_obj_' + Date.now() + '_' + Math.floor(Math.random() * 999);
        const x = Number(xPos) || 1500;

        if (tool === 'spike') {
          cl.objects.push({ id, type: 'spike', x, y: 0, w: 40, h: 40, spikeDir: 'up', phase });
        } else if (tool === 'saw') {
          cl.objects.push({ id, type: 'spike', x, y: 0, w: 46, h: 46, spikeDir: 'up', visual: 'saw', phase });
        } else if (tool === 'block') {
          cl.objects.push({ id, type: 'block', x, y: 0, w: 140, h: 50, phase });
        } else if (tool === 'jump_pad') {
          cl.objects.push({ id, type: 'jump_pad', x, y: 0, w: 50, h: 15, padType: 'yellow' });
        } else if (tool === 'jump_ring') {
          cl.objects.push({ id, type: 'jump_ring', x, y: 95, w: 44, h: 44, ringType: 'yellow' });
        } else if (tool === 'portal_gravity') {
          cl.objects.push({ id, type: 'portal_gravity', x, y: 0, w: 45, h: 420, portalGravity: -1 });
        } else if (tool === 'portal_glider') {
          cl.objects.push({ id, type: 'portal_vehicle', x, y: 0, w: 45, h: 420, portalVehicle: 'glider' });
        } else if (tool === 'portal_wave') {
          cl.objects.push({ id, type: 'portal_vehicle', x, y: 0, w: 45, h: 420, portalVehicle: 'wave' });
        } else if (tool === 'portal_ufo') {
          cl.objects.push({ id, type: 'portal_vehicle', x, y: 0, w: 45, h: 420, portalVehicle: 'ufo' });
        } else if (tool === 'portal_cube') {
          cl.objects.push({ id, type: 'portal_vehicle', x, y: 0, w: 45, h: 420, portalVehicle: 'cube' });
        }
        cl.objects.sort((a, b) => a.x - b.x);
        savePlayerProfile(appState.profile);
        appState.editorMessage = `Added ${tool.toUpperCase()} at ${x}m`;
        renderUI();

          <div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/85 pointer-events-auto select-none">
            <div class="relative w-full max-w-sm bg-zinc-950 border border-cyan-500/50 rounded-lg p-6 sm:p-7 shadow-2xl flex flex-col items-center text-center">
              <h2 class="text-xl font-mono font-bold tracking-widest uppercase text-white mb-1">PAUSED</h2>
              <span class="text-xs font-mono uppercase tracking-widest text-cyan-400 mb-5">${appState.currentLevel.title}</span>

              <div class="w-full flex items-center justify-between p-3 bg-zinc-900/80 rounded border border-zinc-800 mb-3">
                <div class="text-left font-mono">
                  <span class="text-xs font-bold text-white block">PRACTICE MODE</span>
                  <span class="text-[10px] text-zinc-400">Place checkpoints with [Z] / [X]</span>
                </div>
                <button
                  onclick="window.appActions.togglePractice()"
                  class="w-12 h-6 rounded-full transition-colors relative cursor-pointer ${
                    t.isPractice ? 'bg-emerald-500' : 'bg-zinc-700'
                  }"
                >
                  <div class="w-5 h-5 bg-white rounded-full absolute top-0.5 transition-transform ${
                    t.isPractice ? 'translate-x-6' : 'translate-x-1'
                  }"></div>
                </button>
              </div>

              <div class="w-full flex items-center justify-between p-3 bg-zinc-900/80 rounded border border-zinc-800 mb-5">
                <div class="text-left font-mono">
                  <span class="text-xs font-bold text-amber-300 block">AUTOPLAY BOT [A]</span>
                  <span class="text-[10px] text-zinc-400">AI Pilot steers & shifts phase</span>
                </div>
                <button
                  onclick="window.appActions.toggleAutoplay()"
                  class="w-12 h-6 rounded-full transition-colors relative cursor-pointer ${
                    t.isAutoplay ? 'bg-amber-400' : 'bg-zinc-700'
                  }"
                >
                  <div class="w-5 h-5 bg-white rounded-full absolute top-0.5 transition-transform ${
                    t.isAutoplay ? 'translate-x-6' : 'translate-x-1'
                  }"></div>
                </button>
              </div>

              <div class="w-full flex flex-col gap-2.5 font-mono text-xs font-bold uppercase tracking-wider">
                <button
                  onclick="window.appActions.pauseGame()"
                  class="w-full py-3 bg-cyan-500 hover:bg-cyan-400 text-black rounded cursor-pointer transition-all"
                >
                  ▶ RESUME [ESC / SPACE]
                </button>
                <button
                  onclick="window.appActions.restartGame()"
                  class="w-full py-2.5 bg-zinc-900 hover:bg-zinc-800 text-cyan-300 border border-cyan-500/40 rounded cursor-pointer transition-all"
                >
                  ↻ RESTART LEVEL [R]
                </button>
                <button
                  onclick="window.appActions.openLevelSelect()"
                  class="w-full py-2 bg-transparent hover:bg-zinc-900 text-zinc-400 hover:text-white rounded cursor-pointer transition-all"
                >
                  ❖ EXIT TO LEVEL SELECT
                </button>
              </div>
            </div>
          </div>
        `;
      } else if (appState.engineState === 'victory' && appState.victoryStats) {
        const vs = appState.victoryStats;
        const coinCount = vs.coins.filter(Boolean).length;
        const grade = coinCount === 3 && vs.attempts <= 3 ? 'S+' : coinCount >= 2 ? 'S' : coinCount >= 1 ? 'A' : 'B';

        modalHtml = `
          <div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/85 pointer-events-auto select-none">
            <div class="relative w-full max-w-md bg-zinc-950 border border-cyan-400 rounded-lg p-6 sm:p-8 shadow-[0_0_50px_rgba(0,240,255,0.3)] flex flex-col items-center text-center">
              <div class="w-16 h-16 rounded-full bg-amber-500/20 border border-amber-400/60 text-amber-400 flex items-center justify-center mb-4 text-3xl">
                🏆
              </div>
              <h2 class="text-2xl font-mono font-bold tracking-widest uppercase text-white mb-1">SECTOR SYNCHRONIZED</h2>
              <span class="text-xs font-mono uppercase tracking-widest text-cyan-400 mb-6">${appState.currentLevel.title} · 100% COMPLETION</span>

              <div class="w-full grid grid-cols-2 gap-3 mb-6 font-mono text-left bg-black/60 p-4 rounded border border-cyan-900/40">
                <div>
                  <span class="text-[10px] text-zinc-400 block uppercase">PERFORMANCE GRADE</span>
                  <span class="text-xl font-bold text-amber-300 tabular-nums">RANK ${grade}</span>
                </div>
                <div>
                  <span class="text-[10px] text-zinc-400 block uppercase">TOTAL SCORE</span>
                  <span class="text-xl font-bold text-emerald-400 tabular-nums">${(vs.score || 0).toLocaleString()}</span>
                </div>
                <div>
                  <span class="text-[10px] text-zinc-400 block uppercase">ATTEMPTS & COMBO</span>
                  <span class="text-lg font-bold text-white tabular-nums">${vs.attempts} ATT · ${vs.maxCombo || 1}X MAX</span>
                </div>
                <div>
                  <span class="text-[10px] text-zinc-400 block uppercase">TIME & COINS</span>
                  <div class="flex items-center gap-2">
                    <span class="text-base font-bold text-cyan-300 tabular-nums">${vs.time.toFixed(1)}s</span>
                    <div class="flex gap-1">
                      ${vs.coins
                        .map(
                          (c) =>
                            `<span class="text-base ${
                              c ? 'text-amber-400 drop-shadow-[0_0_6px_#ffaa00]' : 'text-zinc-700'
                            }">★</span>`
                        )
                        .join('')}
                    </div>
                  </div>
                </div>
              </div>

              <div class="w-full flex flex-col gap-2.5 font-mono">
                ${
                  hasNextLevel
                    ? `<button
                        onclick="window.appActions.nextLevel()"
                        class="w-full py-3 bg-gradient-to-r from-cyan-400 to-blue-500 hover:from-cyan-300 hover:to-blue-400 text-black font-bold text-sm uppercase tracking-wider rounded cursor-pointer transition-all shadow-[0_0_20px_rgba(0,240,255,0.5)]"
                      >
                        NEXT SECTOR →
                      </button>`
                    : ''
                }
                <button
                  onclick="window.appActions.restartGame()"
                  class="w-full py-2.5 bg-zinc-900 hover:bg-zinc-800 text-cyan-300 border border-cyan-500/40 font-semibold text-xs uppercase tracking-wider rounded cursor-pointer transition-all"
                >
                  ↻ PLAY AGAIN
                </button>
                <button
                  onclick="window.appActions.openLevelSelect()"
                  class="w-full py-2 text-zinc-400 hover:text-white text-xs uppercase tracking-wider rounded cursor-pointer transition-all"
                >
                  ❖ SECTOR SELECTION
                </button>
              </div>
            </div>
          </div>
        `;
      }

      root.innerHTML = `
        <div class="absolute inset-0 z-20 pointer-events-none select-none flex flex-col justify-between p-4 sm:p-6 overflow-hidden">
          <!-- TOP PERIMETER HUD STRIP -->
          <div class="flex flex-col gap-2 w-full">
            <div class="flex flex-wrap items-center justify-between gap-3 w-full">
              <!-- Left: Level Info, Attempts, Score & Combo -->
              <div class="flex items-center gap-3 bg-black/75 border border-cyan-900/60 px-3.5 py-1.5 rounded pointer-events-auto">
                <div>
                  <span class="text-[10px] uppercase font-mono tracking-wider text-cyan-400/90 block">${appState.currentLevel.title}</span>
                  <div class="flex items-center gap-2.5">
                    <span id="hud-attempt" class="text-xs font-mono font-bold text-white tabular-nums">ATTEMPT ${t.attempts}</span>
                    <span id="hud-score" class="text-xs font-mono font-bold text-emerald-400 tabular-nums">SCORE ${t.score.toLocaleString()}</span>
                    <span id="hud-combo" class="text-xs font-mono font-bold text-amber-300 tabular-nums">${t.combo}X COMBO</span>
                  </div>
                </div>
                <div class="flex items-center gap-1 pl-2 border-l border-zinc-800">
                  <span id="hud-coin-0" class="text-zinc-700 text-sm">★</span>
                  <span id="hud-coin-1" class="text-zinc-700 text-sm">★</span>
                  <span id="hud-coin-2" class="text-zinc-700 text-sm">★</span>
                </div>
              </div>

              <!-- Center: Live Progress Bar -->
              <div class="flex-1 min-w-[160px] max-w-md mx-2 flex flex-col items-center">
                <div class="w-full flex justify-between items-center text-[11px] font-mono mb-1">
                  <span class="text-zinc-400">SECTOR PROGRESS</span>
                  <span id="hud-percent" class="text-cyan-300 font-bold tabular-nums">${t.percent}%</span>
                </div>
                <div class="w-full h-2.5 bg-black/80 rounded-full overflow-hidden border border-cyan-900/60">
                  <div id="hud-progress-bar" class="h-full bg-gradient-to-r from-cyan-400 via-blue-500 to-fuchsia-500 rounded-full transition-all duration-75" style="width:${t.percent}%"></div>
                </div>
              </div>

              <!-- Right: Separated Abilities, Autoplay, Mute & Pause -->
              <div class="flex flex-wrap items-center gap-2 pointer-events-auto">
                <button
                  id="hud-phase-btn"
                  onclick="window.appActions.triggerPhaseShift()"
                  class="px-3 py-1.5 rounded border font-mono text-xs font-bold uppercase tracking-wider flex items-center gap-1.5 transition-colors cursor-pointer bg-cyan-950/80 border-cyan-400 text-cyan-300"
                  title="Toggle Dimension Phase [Shift or F]"
                >
                  <span id="hud-phase-dot" class="w-2 h-2 rounded-full bg-cyan-400"></span>
                  <span id="hud-phase-text">CYAN [SHIFT / F]</span>
                </button>

                <button
                  id="hud-slow-btn"
                  onclick="window.appActions.toggleTimeSlow()"
                  class="px-3 py-1.5 rounded border font-mono text-xs font-bold uppercase tracking-wider flex items-center gap-1.5 cursor-pointer bg-sky-950/70 border-sky-500/40 text-sky-300"
                  title="Time Dilation 0.5x Slowdown [Hold E / S / Down or Click]"
                >
                  <span>⏱ 0.5X SLOW [E]</span>
                </button>

                <button
                  id="hud-auto-btn"
                  onclick="window.appActions.toggleAutoplay()"
                  class="px-3 py-1.5 rounded border font-mono text-xs font-bold uppercase tracking-wider flex items-center gap-1.5 cursor-pointer bg-zinc-900/80 border-amber-500/40 text-amber-300"
                  title="Toggle AI Autoplay Pilot [A]"
                >
                  ${t.isAutoplay ? 'AUTOPLAY: ON [A]' : 'AUTOPLAY: OFF [A]'}
                </button>

                <button
                  onclick="window.appActions.toggleMute()"
                  class="p-2 bg-black/75 hover:bg-black/90 text-cyan-400 border border-cyan-900/60 rounded cursor-pointer"
                  title="${muted ? 'Unmute' : 'Mute'}"
                >
                  ${muteIcon}
                </button>

                <button
                  onclick="window.appActions.pauseGame()"
                  class="p-2 bg-black/75 hover:bg-black/90 text-cyan-400 border border-cyan-900/60 rounded cursor-pointer font-mono text-xs font-bold px-2.5"
                  title="Pause Game [Esc]"
                >
                  ❚❚
                </button>
              </div>
            </div>

            <!-- AI Pilot Live Telemetry Banner -->
            <div
              id="hud-ai-banner"
              style="display:${t.isAutoplay ? 'flex' : 'none'}"
              class="self-center items-center gap-2 px-3.5 py-1 bg-amber-500/20 border border-amber-400/60 rounded-full font-mono text-[11px] text-amber-300 shadow-[0_0_15px_rgba(255,170,0,0.25)]"
            >
              <span class="w-2 h-2 rounded-full bg-amber-400 animate-ping"></span>
              <span id="hud-ai-state">AI TELEMETRY: ${t.aiStatus} · VEHICLE: ${t.vehicleMode.toUpperCase()}</span>
            </div>
          </div>

          <!-- PRACTICE MODE FLOATING DOCK -->
          <div
            id="hud-practice-dock"
            style="display:${t.isPractice ? 'flex' : 'none'}"
            class="pointer-events-auto self-center items-center gap-3 bg-black/85 border border-emerald-500/40 px-4 py-2 rounded-lg shadow-lg mb-2"
          >
            <button
              onclick="window.appActions.addCheckpoint()"
              class="flex items-center gap-1.5 px-3 py-1 bg-emerald-500/20 hover:bg-emerald-500/40 text-emerald-300 border border-emerald-500/50 rounded font-mono text-xs font-bold uppercase cursor-pointer"
            >
              <span>+ DROP CHECKPOINT [Z]</span>
            </button>
            <button
              onclick="window.appActions.removeCheckpoint()"
              class="flex items-center gap-1.5 px-3 py-1 bg-red-500/20 hover:bg-red-500/40 text-red-300 border border-red-500/50 rounded font-mono text-xs font-bold uppercase cursor-pointer"
            >
              <span>- REMOVE [X]</span>
            </button>
          </div>

          <!-- ON-SCREEN TOUCH & MOUSE CONTROLS (SUPPORTS CONTINUOUS HOLD IN GLIDER/WAVE + TAP IN CUBE/UFO!) -->
          <div class="flex items-end justify-between w-full pointer-events-auto gap-3">
            <div class="flex flex-wrap items-center gap-2.5">
              <button
                onclick="window.appActions.triggerPhaseShift()"
                class="px-5 py-4 bg-fuchsia-950/85 hover:bg-fuchsia-900 active:bg-fuchsia-600 border border-fuchsia-500/60 text-fuchsia-200 font-mono text-xs font-bold uppercase tracking-wider rounded-lg cursor-pointer transition-all active:scale-95 shadow-md"
              >
                ⚡ PHASE SHIFT [SHIFT / F]
              </button>

              <button
                onclick="window.appActions.toggleTimeSlow()"
                class="px-5 py-4 bg-sky-950/85 hover:bg-sky-900 active:bg-sky-600 border border-sky-500/60 text-sky-200 font-mono text-xs font-bold uppercase tracking-wider rounded-lg cursor-pointer transition-all active:scale-95 shadow-md"
              >
                ⏱ TIME SLOW [E / S]
              </button>
            </div>

            <button
              onpointerdown="window.appActions.triggerJumpDown(event)"
              onpointerup="window.appActions.triggerJumpUp(event)"
              onpointerleave="window.appActions.triggerJumpUp(event)"
              onpointercancel="window.appActions.triggerJumpUp(event)"
              onclick="window.appActions.triggerJumpTap()"
              class="px-8 py-5 bg-cyan-950/85 hover:bg-cyan-900 active:bg-cyan-500 border border-cyan-400/60 text-cyan-200 active:text-black font-mono text-sm font-bold uppercase tracking-widest rounded-lg cursor-pointer transition-all active:scale-95 shadow-md"
            >
              ▲ JUMP / FLY [SPACE]
            </button>
          </div>
        </div>
        ${modalHtml}
      `;
      updateHudDOM();
    }

    // =========================================================================
    // 7. BOOTSTRAP ON WINDOW LOAD
    // =========================================================================
    
    // Auto-start Dry Out menu music on initial interaction
    const initMenuAudio = () => {
      rhythmAudio.ensureContext();
      if (appState.view !== 'gameplay') {
        rhythmAudio.startMenuMusic();
      }
    };
    window.addEventListener('click', initMenuAudio, { once: true });
    window.addEventListener('keydown', initMenuAudio, { once: true });
    window.addEventListener('touchstart', initMenuAudio, { once: true });

    window.addEventListener('load', () => {
      const mount = document.getElementById('canvas-mount');
      engine = new GlitchPulseEngine(
        mount,
        appState.currentLevel,
        appState.profile.customization,
        {
          onTelemetry: (t) => {
            appState.telemetry = t;
            updateHudDOM();

            const lvlId = engine ? engine.currentLevel.id : appState.currentLevel.id;
            const currentBest = appState.profile.levels[lvlId]?.bestPercent || 0;
            if (t.percent > currentBest) {
              appState.profile.levels[lvlId] = {
                ...appState.profile.levels[lvlId],
                bestPercent: t.percent,
                attempts: Math.max(appState.profile.levels[lvlId]?.attempts || 0, t.attempts),
              };
              savePlayerProfile(appState.profile);
            }
          },
          onStateChange: (newState) => {
            const prevState = appState.engineState;
            appState.engineState = newState;
            if (prevState !== newState && (newState === 'paused' || newState === 'victory' || prevState === 'paused' || prevState === 'victory')) {
              renderUI();
            }
          },
          onVictory: (stats) => {
            appState.victoryStats = stats;
            const lvlId = stats.level.id;
            const currentLvl = appState.profile.levels[lvlId] || {
              completed: false,
              bestPercent: 0,
              attempts: 0,
              coins: [false, false, false],
              bestTime: 0,
              bestScore: 0,
            };

            const mergedCoins = [
              Boolean(currentLvl.coins[0] || stats.coins[0]),
              Boolean(currentLvl.coins[1] || stats.coins[1]),
              Boolean(currentLvl.coins[2] || stats.coins[2]),
            ];

            const newlyCompleted = !currentLvl.completed;
            appState.profile = {
              ...appState.profile,
              starsCollected: appState.profile.starsCollected + (newlyCompleted ? stats.level.stars : 0),
              levels: {
                ...appState.profile.levels,
                [lvlId]: {
                  completed: true,
                  bestPercent: 100,
                  attempts: stats.attempts,
                  coins: mergedCoins,
                  bestTime: currentLvl.bestTime > 0 ? Math.min(currentLvl.bestTime, stats.time) : stats.time,
                  bestScore: Math.max(currentLvl.bestScore || 0, stats.score || 0),
                },
              },
            };
            savePlayerProfile(appState.profile);

            // Unlock Campaign & Coin Achievements
            if (lvlId === 1) unlockAchievement('ach_first_sync');
            if (lvlId === 2) unlockAchievement('ach_glider_ace');
            if (lvlId === 3) unlockAchievement('ach_wave_rider');
            if (lvlId === 4) unlockAchievement('ach_singularity');
            if (lvlId === 5) unlockAchievement('ach_quantum_ufo');
            if (lvlId === 6) unlockAchievement('ach_omega_slayer');
            if (lvlId === 7) unlockAchievement('ach_firewall_breaker');
            if (lvlId === 8) unlockAchievement('ach_game_complete');
            if (stats.wasAutoplay) unlockAchievement('ach_ai_director');

            let totalCoins = 0;
            for (const k of [1, 2, 3, 4, 5, 6, 7, 8, 9]) {
              const cArr = appState.profile.levels[k]?.coins || [];
              totalCoins += cArr.filter(Boolean).length;
            }
            if (totalCoins >= 9) unlockAchievement('ach_coin_hunter');
            if (totalCoins >= 18) unlockAchievement('ach_coin_master');

            renderUI();
          },
        }
      );

      renderUI();
    });
  </script>
</body>
</html>
